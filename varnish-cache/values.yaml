    # Type: object or template string
    labels: {}

    # Applies extra annotations to the Service. The value can be set as either an object
    # or a template string.
    # Type: object or template string
    annotations: {}

    # Sets the type of the Service. Can be either `ClusterIP`, `LoadBalancer`, or
