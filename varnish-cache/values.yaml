  # Example:
  #   nodeSelector:
  #     beta.kubernetes.io/arch: amd64
  nodeSelector: {}

  # An array of objects that conforms to the Kubernetes
  # [tolerations](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#PodSpec)
