  # template string.
  # Type: array or template string
  # Example:
  #   extraVolumes: |
  #     - name: {{ .Release.Name }}-local-data
  #       hostPath:
  #         path: /data
  #         type: Directory
  extraVolumes: []

  # An object for configuring the Massive Storage Engine 4 (MSE4).
  # Type: object
  mse4:
    # Enables Massive Storage Engine 4. When disabled, varnishd uses its default storage.
    #
    # To set the amount of memory MSE4 uses, set the `memory_target` parameter with
    # `server.parameters.memoryTarget`, as a percentage (e.g., "80%") or in bytes
    # ("512m"). If `server.resources` sets a memory limit, the percentage is of that
    # limit.
    # Type: boolean
    # Availability: v1.6.1
    enabled: false

    # An MSE4 configuration. By default, the value is unset and MSE4 is run in a
    # memory-only mode.
    #
    # If `server.mse4.persistence.enabled` is true, the persistent volume is mounted at
    # `/var/lib/mse4`; use that path for the books and stores in the configuration.
    # Type: template string
    # Availability: v1.6.1
    config: ""

    persistence:
      # Enables MSE4 persistence; only applicable if `server.kind` is `StatefulSet`. Note
      # that the backing storage must be "ext4".
      # Type: boolean
      enabled: false

      # Database size relative to `server.mse4.persistence.storageSize`, for
      # auto-configuring MSE4. Can be set as a percentage or a value.
      #
      # `server.mse4.persistence.bookSize` and `server.mse4.persistence.storeSize` must
      # add up to 100% or `server.mse4.persistence.storageSize`. Only applicable if
      # `server.mse4.config` is empty.
      # Type: string or number
      bookSize: "1%"

      # Store size relative to `server.mse4.persistence.storageSize`, for auto-configuring
      # MSE4. Can be set as a percentage or a value.
      #
      # `server.mse4.persistence.bookSize` and `server.mse4.persistence.storeSize` must
      # add up to 100% or `server.mse4.persistence.storageSize`. Only applicable if
      # `server.mse4.config` is empty.
      # Type: string or number
      storeSize: "91%"

      # Sets the extra labels for the PersistentVolumeClaim for MSE4. Can be set as an
      # object or a template string.
      # Type: object or template string
      labels: {}

      # Sets the extra annotations for the PersistentVolumeClaim for MSE4. Can be set as
      # an object or a template string.
      # Type: object or template string
      annotations: {}

      # Sets the storage access modes for the PersistentVolumeClaim for MSE4.
      # Type: array of strings
      accessModes:
        - "ReadWriteOnce"

      # Sets the storage class for the PersistentVolumeClaim for MSE4.
      # Type: string
      storageClassName: ""

      # Sets the storage size for the PersistentVolumeClaim for MSE4.
      # Type: string
      storageSize: "10Gi"

  # The main VCL of Varnish Enterprise, mounted at `/etc/varnish/default.vcl`. It can load
  # the files of `server.vcls.includes` with `include "./vcls/<file>";`. It must not be
  # set together with `server.vcls.routes`.
  # Type: template string
  # Example:
  #   vclConfig: |
  #     vcl 4.1;
  #
  #     backend default {
  #       .host = "www.example.com";
  #       .port = "80";
  #     }
  #
  #     sub vcl_backend_fetch {
  #       set bereq.http.Host = "www.example.com";
  #     }
  vclConfig: ""

  # Per-domain VCL routing (multi-tenant) and shared VCL files. When `server.vcls.routes`
  # is set, the chart generates a routing VCL and a cmdfile from these settings,
  # superseding `server.vclConfig`. `server.vcls.includes` works with or without routes.
  # Type: object
  # Availability: v1.8.0
  vcls:
    # Per-domain VCL routing. When set, the chart generates a routing VCL and a cmdfile
    # that load each route as a separate VCL and select it based on the Host header,
    # superseding `server.vclConfig` (which must not be set). Each route must set
    # `vclContent`, and can set `name` (defaults to the first hostname, prefixed with
    # `route_` if it does not start with a letter) and `hostnames`. As it is used as a VCL
    # label, `name` must start with a letter. A route without hostnames is a catch-all and
    # must be the last one.
    # Type: array of objects
    # Example:
    #   routes:
    #     - name: foo-site
    #       hostnames:
    #         - foo.com
    #         - www.foo.com
    #       vclContent: |
    #         vcl 4.1;
    #         backend default { .host = "foo-backend"; }
    #     - vclContent: |
    #         vcl 4.1;
    #         backend default none;
    #         sub vcl_recv { return (synth(404)); }
    routes: []

    # Extra VCL files placed in `/etc/varnish/vcls/`, next to the route VCLs if any. Each
    # key is a filename (subdirectories allowed) and each value a template string. Load
    # them with a path relative to the including file: `include "./vcls/<file>";` from
    # `server.vclConfig`, and `include "./<file>";` from a route VCL. Plain filenames are
    # looked up in `vcl_path` instead.
    # Type: object of template strings
    # Example:
    #   includes:
    #     helpers.vcl: |
    #       sub common_recv {
    #       }
    includes: {}

  # Sets a base URL for Varnish Controller and Varnish Controller Router when performing a
  # HTTP-based routing. If unset, the URL will infer from a Pod IP and `server.http.port`.
  # Type: string
  # Availability: v1.4.0
  baseUrl: ""

  # Sets the termination grace period seconds to wait for Varnish Enterprise to shut down.
  # Once this number of seconds is reached without the Varnish Enterprise Pod shutting
  # down, Kubernetes will send SIGKILL to the Pod. When unset, the Kubernetes default (30
  # seconds) applies; `0` is rendered as is.
  #
  # When `server.delayedShutdown.method` is not "none", this value must be set, and
  # rendering fails if it is shorter than the delay:
  # `server.delayedShutdown.sleep.seconds`, `server.delayedShutdown.mempool.waitSeconds`
  # or `server.delayedShutdown.shutdownDelay.seconds`. Set it higher than the **maximum**
  # time (in seconds) it takes Varnish Enterprise to fully shut down after a delayed
  # shutdown. With "mempool", that includes the time to drain connections.
  #
  # The value to set here depends on the cluster setup. For example, an AWS Load Balancer
  # may still forward requests to Varnish for `deregistration_delay.timeout_seconds` which
  # is set to 300 seconds by default. If `server.delayedShutdown` took 30 seconds, then
  # `server.terminationGracePeriodSeconds` should be set to _at least_ 330 seconds in
  # order to have a zero-downtime during a rolling update or scaling down.
  # Type: number
  # Availability: v1.6.0
  terminationGracePeriodSeconds: null

  # Configures delayed shutdown for zero-downtime downscaling.
  # Type: object
  delayedShutdown:
    # Sets the method for delaying the shutdown of Varnish Enterprise. This is useful for
    # rolling updates or when scaling down, where the load balancer component may still
    # attempt to forward requests to the Varnish Enterprise instance when Varnish
    # Enterprise has already received a SIGHUP, leading to HTTP 502 errors.
    #
    # Multiple methods are provided here:
    #
    # - `sleep` will simply sleep in the `preStop` for `server.delayedShutdown.sleep.seconds` seconds. This is the simplest way to delay the shutdown of Varnish Enterprise when the time taken for the load balancer component to stop forwarding traffic to Varnish Enterprise is largely fixed.
    # - `mempool` polls varnishstat for `MEMPOOL.sess` to go down to zero. This allows for the quickest shutdown but requires tuning `server.delayedShutdown.mempool.pollSeconds` to traffic patterns (as `MEMPOOL.sess` may become 0 momentarily, resulting in an early shutdown).
    #
    # When `server.delayedShutdown.method` is set to a value other than "none",
    # `server.terminationGracePeriodSeconds` **must** also be set, to at least the delay.
    # Rendering fails otherwise.
    # Type: string, one of `none`, `sleep`, `mempool`, or `shutdown_delay`
    # Availability: v1.6.0
    method: "none"

    # Configures the "sleep" delayed shutdown method.
    # Type: object
    sleep:
      # Sets the number of seconds to sleep before SIGHUP is sent to Varnish Enterprise.
      # Only applicable when `server.delayedShutdown.method` is set to "sleep".
      # Type: number or string
      seconds: 90

    # Configures the "mempool" delayed shutdown method.
    # Type: object
    mempool:
      # Sets the number of seconds to poll for `MEMPOOL.sess` stats. Only applicable when
      # `server.delayedShutdown.method` is set to "mempool".
      #
      # This value requires tuning to traffic patterns. If the time between each traffic
      # took more than `server.delayedShutdown.mempool.pollSeconds`, then Varnish
      # Enterprise could be signaled to SIGHUP too early, leading to an HTTP 502 error on
      # the load balancer (as Varnish Enterprise already stopped accepting connection).
      # Type: number or string
      pollSeconds: 1

      # Sets the number of seconds to wait after `MEMPOOL.sess` turned zero. Only
      # applicable when `server.delayedShutdown.method` is set to "mempool".
      # Type: number or string
      waitSeconds: 5

    # Configures the "shutdown_delay" delayed shutdown method. It is similar to `sleep`,
    # but uses the `shutdown_delay` feature of Varnish Enterprise (6.0.13r2 and newer) to
    # perform the wait in-engine instead of relying on `preStop` and an external command.
    # Type: object
    shutdownDelay:
      # Sets the number of seconds to delay the shutdown in-engine. Only applicable when
      # `server.delayedShutdown.method` is set to "shutdown_delay".
      # Type: number or string
      seconds: 90

  # Sets the image and tag to use to deploy Varnish Enterprise.
  # Type: object
  image:
    # Sets the repository for Varnish Enterprise image.
    # Type: string
    repository: "quay.io/varnish-software/varnish-plus"

    # Sets the
    # [imagePullPolicy](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
    # for the Varnish Enterprise image. This can be one of Always, Never, or IfNotPresent.
    # Type: string
    pullPolicy: "IfNotPresent"

    # Sets the tag for the Varnish Enterprise image. By default, this is set to the same
    # application version as in the Varnish Enterprise Helm Chart. If the tag is set to
    # non-exact versions (such as "latest"), make sure to set `server.image.pullPolicy` to
    # "Always" to make sure the image is always updated.
    # Type: string
    tag: ""

  # An object for configuring
  # [HorizontalPodAutoscaling](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/).
  # Type: object
  autoscaling:
    # Enables the
    # [HorizontalPodAutoscaling](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/)
    # with the Varnish Enterprise Pod. `server.replicas` is ignored if autoscaling is
    # enabled. Rendering fails when `server.kind` is `DaemonSet`, which has no replicas to
    # scale.
    # Type: boolean
    enabled: false

    # Sets the minimum number of replicas to always keep running. When set to "-", the
    # value of `server.replicas` is used.
    # Type: number or "-"
    minReplicas: "-"

    # Sets the maximum number of replicas to run at most.
    # Type: number
    maxReplicas: 100

    # Sets the
    # [HorizontalPodAutoscaling](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/)
    # behavior. The value can be set as either an object or a template string.
    # Type: object or template string
    # Availability: v1.6.0
    # Example:
    #   behavior:
    #     scaleDown:
    #       stabilizationWindowSeconds: 120
    #       policies:
    #         - type: Percent
    #           value: 50
    #           periodSeconds: 60
    #     scaleUp:
    #       policies:
    #         - type: Percent
    #           value: 100
    #           periodSeconds: 60
    #         - type: Pods
    #           value: 4
    #           periodSeconds: 60
    #       selectPolicy: Max
    behavior: ""

    # Sets the
    # [HorizontalPodAutoscaling](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/)
    # metrics. The value can be set as either an array or a template string.
    # Type: array or template string
    # Example:
    #   metrics: |
    #     - type: Resource
    #       resource:
    #         name: cpu
    #         target:
    #           type: Utilization
    #           averageUtilization: 80
    metrics: ""

  # An object for configuring
  # [PodDisruptionBudget](https://kubernetes.io/docs/concepts/workloads/pods/disruptions/).
  # See also [Specifying a Disruption Budget for your
  # Application](https://kubernetes.io/docs/tasks/run-application/configure-pdb/).
  # Type: object
  pdb:
    # Enables PodDisruptionBudget.
    # Type: boolean
    # Availability: v1.2.0
    enabled: false

    # Sets the number or percentage of pods that must be available after the eviction.
    # Required if `server.pdb.enabled` is true and `server.pdb.maxUnavailable` is not set.
    # Type: string or number
    # Availability: v1.2.0
    minAvailable: ""

    # Sets the number or percentage of pods that can be unavailable after the eviction.
    # Required if `server.pdb.enabled` is true and `server.pdb.minAvailable` is not set.
    # Type: string or number
    # Availability: v1.2.0
    maxUnavailable: ""

  # An object for configuring
  # [Service](https://kubernetes.io/docs/concepts/services-networking/service/).
  # Type: object
  service:
    # Enables the
    # [Service](https://kubernetes.io/docs/concepts/services-networking/service/) for
    # Varnish Enterprise.
    # Type: boolean
    enabled: true

    # Applies extra labels to the Service. The value can be set as either an object or a
    # template string.
    # Type: object or template string
    labels: {}

    # Applies extra annotations to the Service. The value can be set as either an object
    # or a template string.
    # Type: object or template string
    annotations: {}

    # Sets the type of the Service. Can be either `ClusterIP`, `LoadBalancer`, or
    # `NodePort`.
    #
    # See also [Accessing Varnish Enterprise in Kubernetes
    # Cluster](https://docs.varnish-software.com/varnish-helm/guides/accessing-varnish-enterprise/).
    # Type: string
    type: "NodePort"

    # Sets a custom [Service
    # ClusterIP](https://kubernetes.io/docs/concepts/services-networking/service/#type-clusterip).
    # This value can be set as either an IP address, or a literal string "None". Only
    # applicable when `server.service.type` is set to ClusterIP. When set to "None",
    # Kubernetes will create a Headless Service, skipping the Kubernetes proxying
    # mechanism. In such case, `server.service.http.port` and `server.service.https.port`
    # are ignored, and `server.http.port` and `server.tls.port` are used instead.
    #
    # See also [Accessing Varnish Enterprise in Kubernetes
    # Cluster](https://docs.varnish-software.com/varnish-helm/guides/accessing-varnish-enterprise/).
    # Type: string
    clusterIP: ""

    # Sets a pre-allocated IP address for use in LoadBalancer.
    # Type: string
    # Availability: v1.4.0
    loadBalancerIP: ""

    # Configures the `http` port of the Service. The port is exposed if and only if
    # `server.http.enabled` is true.
    # Type: object
    http:
      # Sets the port to expose HTTP service.
      # Type: number
      port: 80

      # Sets the port to expose HTTP service directly on the node itself. Only applicable
      # when `server.service.type` is set to NodePort. This value must be within the
      # Kubernetes service-node-port-range (default: 30000-32767).
      #
      # See also [Accessing Varnish Enterprise in Kubernetes
      # Cluster](https://docs.varnish-software.com/varnish-helm/guides/accessing-varnish-enterprise/).
      # Type: number
      #nodePort: 30080

    # Configures the `https` port of the Service. The port is exposed if and only if
    # `server.tls.enabled` is true.
    # Type: object
    https:
      # Sets the port to expose HTTPS service.
      # Type: number
      port: 443

      # Sets the port to expose HTTPS service directly on the node itself. Only applicable
      # when `server.service.type` is set to NodePort. This value must be within the
      # Kubernetes service-node-port-range (default: 30000-32767).
      #
      # See also [accessing Varnish via
      # NodePort](https://docs.varnish-software.com/varnish-helm/guides/accessing-varnish-enterprise/#nodeport).
      # Type: number
      #nodePort: 30443

    # An array of extra services to expose via the Service. Each extra service adds a port
    # named `extra-<name>` to the Service.
    # Type: array of objects
    # Example:
    #   extraServices:
    #     - name: proxy
    #       targetPort: 8088
    #       port: 8088
    #       nodePort: 30888
    extraServices: []

    # Sets the internal traffic policy for this service. InternalTrafficPolicy describes
    # how nodes distribute service traffic they receive on the ClusterIP. Can be set to
    # `Local` or `Cluster`. If unset, the Kubernetes default (`Cluster`) is used.
    # Type: string
    # Availability: v1.9.0
    internalTrafficPolicy: ""

    # Sets the external traffic policy for this service. externalTrafficPolicy describes
    # how nodes distribute service traffic they receive on one of the Service's
    # "externally-facing" addresses (NodePorts, ExternalIPs, and LoadBalancer IPs). Can be
    # set to `Local` or `Cluster`. Only rendered when `server.service.type` is NodePort or
    # LoadBalancer, the only types Kubernetes accepts it for.
    # Type: string
    externalTrafficPolicy: "Cluster"

  # An object for configuring
  # [Ingress](https://kubernetes.io/docs/concepts/services-networking/ingress/).
  # Type: object
  ingress:
    # Enables the
    # [Ingress](https://kubernetes.io/docs/concepts/services-networking/ingress/) for
    # Varnish Enterprise. Requires `server.http.enabled`; the Ingress targets the
    # Service's `http` port (`server.service.http.port`).
    # Type: boolean
    enabled: false

    # Applies extra labels to the Ingress. The value can be set as either an object or a
    # template string.
    # Type: object or template string
    labels: {}

    # Applies extra annotations to the Ingress. The value can be set as either an object
    # or a template string.
    # Type: object or template string
    annotations: {}

    # Sets the [Ingress
    # Class](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class)
    # for selecting Ingress controller to use.
    # Type: string
    ingressClassName: ""

    # Sets the [Ingress Path
    # Type](https://kubernetes.io/docs/concepts/services-networking/ingress/#path-types)
    # for the Varnish Enterprise endpoint. The value can be either `Prefix`, `Exact`, or
    # `ImplementationSpecific`. The value to use here depends on the Ingress controller.
    # Type: string
    pathType: "Prefix"

    # Sets the hostnames for the Ingress. These hostnames are used for routing traffic.
    # Type: array of objects
    # Example:
    #   hosts:
    #     - host: chart-example.local
    #       paths: []
    hosts: []

    # An array of objects that conforms to [Ingress
    # TLS](https://kubernetes.io/docs/concepts/services-networking/ingress/#tls).
    # Type: array of objects
    # Example:
    #   tls:
    #     - secretName: chart-example-tls
    #       hosts:
    #         - chart-example.local
    tls: []

  # An object that conforms to the Kubernetes
  # [securityContext](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
  # definition of a Container.
  #
  # This securityContext will be set on the Varnish Enterprise container and the chart's
  # init containers. For setting securityContext on the Pod itself, see
  # `global.podSecurityContext`. For setting securityContext on every container the chart
  # creates, see `global.securityContext`.
  # Type: object or template string
  # Example:
  #   securityContext:
  #     runAsUser: 1000
  securityContext: {}

  # An object that conforms to the Kubernetes
  # [startupProbe](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
  # definition of a Container.
  #
  # Without a handler, the probe is a `tcpSocket` check on `server.http.port`. With
  # `httpGet`, the port is always `server.http.port`. Both need `server.http.enabled`. An
  # `exec`, `grpc` or `tcpSocket` handler is rendered as given.
  # Type: object or false
  # Availability: v1.1.0
  # Example:
  #   startupProbe:
  #     initialDelaySeconds: 5
  #     periodSeconds: 10
  #     timeoutSeconds: 1
  #     successThreshold: 1
  #     failureThreshold: 3
  #     httpGet:
  #       path: /health
  #       httpHeaders:
  #         - name: Host
  #           value: example.com
  startupProbe: {}

  # An object that conforms to the Kubernetes
  # [readinessProbe](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
  # definition of a Container. Set to `false` to disable the probe.
  #
  # Without a handler, the probe is a `tcpSocket` check on `server.http.port`. With
  # `httpGet`, the port is always `server.http.port`. Both need `server.http.enabled`. An
  # `exec`, `grpc` or `tcpSocket` handler is rendered as given.
  # Type: object or false
  # Availability: v1.2.0
  # Example:
  #   readinessProbe:
  #     httpGet:
  #       path: /health
  #       httpHeaders:
  #         - name: Host
  #           value: example.com
  readinessProbe:
    # Sets the initial delay before the first probe is sent to determine if the Varnish
    # Enterprise Pod is ready to accept an incoming connection.
    # Type: number
    initialDelaySeconds: 5

    # Sets the delay between each probe to determine if the Varnish Enterprise Pod is
    # ready to accept an incoming connection after the initial probe.
    # Type: number
    periodSeconds: 10

    # Sets the timeout for the probe to wait for a response from the Varnish Enterprise
    # Pod.
    # Type: number
    timeoutSeconds: 1

    # Sets the number of times when a consecutive successful response is considered a
    # success and the Varnish Enterprise Pod is considered ready to accept an incoming
    # connection.
    # Type: number
    successThreshold: 1

    # Sets the number of times when a consecutive failure response is considered a failure
    # and the Varnish Enterprise Pod is considered unhealthy.
    # Type: number
    failureThreshold: 3

  # An object that conforms to the Kubernetes
  # [livenessProbe](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
  # definition of a Container. Set to `false` to disable the probe.
  #
  # Without a handler, the probe is a `tcpSocket` check on `server.http.port`. With
  # `httpGet`, the port is always `server.http.port`. Both need `server.http.enabled`. An
  # `exec`, `grpc` or `tcpSocket` handler is rendered as given.
  # Type: object or false
  # Example:
  #   livenessProbe:
  #     httpGet:
  #       path: /health
  #       httpHeaders:
  #         - name: Host
  #           value: example.com
  livenessProbe:
    # Sets the initial delay before the first probe is sent to determine if the Varnish
    # Enterprise Pod is still ready to accept an incoming connection (i.e., live).
    # Type: number
    initialDelaySeconds: 30

    # Sets the delay between each probe to determine if the Varnish Enterprise Pod is
    # still ready to accept an incoming connection after the initial probe.
    # Type: number
    periodSeconds: 10

    # Sets the timeout for the probe to wait for a response from the Varnish Enterprise
    # Pod.
    # Type: number
    timeoutSeconds: 5

    # Sets the number of times when a consecutive successful response is considered a
    # success and the Varnish Enterprise Pod is considered still ready to accept an
    # incoming connection.
    # Type: number
    successThreshold: 1

    # Sets the number of times when a consecutive failure response is considered a failure
    # and the Varnish Enterprise Pod is considered unhealthy (i.e., down).
    # Type: number
    failureThreshold: 3

  # An object that conforms to the Kubernetes
  # [resources](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
  # definition of a Container. This configuration can be used to limit resources consumed
  # by the Varnish Enterprise container. The chart's init containers get the same
  # resources.
  # Type: object or template string
  # Example:
  #   resources:
  #     limits:
  #       cpu: "100m"
  #       memory: "128Mi"
  #     requests:
  #       cpu: "100m"
  #       memory: "128Mi"
  resources: {}

  # An object that conforms to the Kubernetes
  # [nodeSelector](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#PodSpec)
  # definition of a Pod. This configuration is used to select a node to schedule a Pod to.
  # The value can be set as either an object or a template string.
  # Type: object or template string
  # Example:
  #   nodeSelector:
  #     beta.kubernetes.io/arch: amd64
  nodeSelector: {}

  # An array of objects that conforms to the Kubernetes
  # [tolerations](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#PodSpec)
  # definition of a Pod. This configuration is used to allow the Pod to be scheduled to
  # nodes with specific taints. The value can be set as either an array of objects or a
  # template string.
  # Type: array or template string
  tolerations: []

  # This configuration is used to fine-grain control the scheduling of the Pod. By
  # default, this is set to ensure all Varnish Enterprise Pods are always run in a
  # different node. To disable this behavior, set to empty string ("") or `false`. The
  # value can be set as either an object or a template string.
  # Type: object, template string or false
  affinity: |
