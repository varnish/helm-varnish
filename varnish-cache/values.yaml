  # Type: object or false
  # Example:
  #   startupProbe:
  #     initialDelaySeconds: 5
  #     periodSeconds: 10
  #     timeoutSeconds: 1
  #     successThreshold: 1
  #     failureThreshold: 3
  #     httpGet:
  #       path: /health
  #       httpHeaders:
  #         - name: Host
  #           value: example.com
  startupProbe: {}

  # An object that conforms to the Kubernetes
  # [readinessProbe](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
  # definition of a Container. Set to `false` to disable the probe.
  # Type: object or false
  # Example:
  #   readinessProbe:
  #     httpGet:
  #       path: /health
  #       httpHeaders:
  #         - name: Host
  #           value: example.com
  readinessProbe:
    # Sets the initial delay before the first probe is sent to determine if the Varnish
    # Cache Pod is ready to accept an incoming connection.
    # Type: number
    initialDelaySeconds: 5

    # Sets the delay between each probe to determine if the Varnish Cache Pod is ready to
    # accept an incoming connection after the initial probe.
    # Type: number
    periodSeconds: 10

    # Sets the timeout for the probe to wait for a response from the Varnish Cache Pod.
    # Type: number
    timeoutSeconds: 1

    # Sets the number of times when a consecutive successful response is considered a
    # success and the Varnish Cache Pod is considered ready to accept an incoming
    # connection.
    # Type: number
    successThreshold: 1

    # Sets the number of times when a consecutive failure response is considered a failure
    # and the Varnish Cache Pod is considered unhealthy.
    # Type: number
    failureThreshold: 3

  # An object that conforms to the Kubernetes
  # [livenessProbe](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
