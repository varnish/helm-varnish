                    paths: []
            items:
              type: object
              additionalProperties: false
              properties:
                host:
                  type: string
                  description: |
                    Sets the hostname to route traffic for.
                paths:
                  type: [array, "null"]
                  items:
                    type: string
                  description: |
                    Sets the paths to route to {product} for this host, as an array of strings. Defaults to `/` when empty.

          tls:
            type: array
            items:
              $ref: "#/definitions/k8sObject"
            default: []
            description: |
              An array of objects that conforms to [Ingress TLS][k8s-ingress-tls].
            x-examples:
              - description: "For example:"
                value:
                  - secretName: chart-example-tls
                    hosts:
                      - chart-example.local

      securityContext:
        $ref: "#/definitions/objectOrTemplate"
        default: {}
        description: |
          An object that conforms to the Kubernetes [securityContext][k8s-pod-v1-containers] definition of a Container.

          This securityContext will be set on the {product} container and the chart's init containers. For setting securityContext on the Pod itself, see `global.podSecurityContext`. For setting securityContext on every container the chart creates, see `global.securityContext`.
        x-examples:
          - description: "For example:"
