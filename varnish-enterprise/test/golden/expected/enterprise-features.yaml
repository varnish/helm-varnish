---
# Source: varnish-enterprise/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: golden-varnish-enterprise
  labels:
    app.kubernetes.io/instance: golden
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: varnish-enterprise
    app.kubernetes.io/version: APP_VERSION
    helm.sh/chart: varnish-enterprise-CHART_VERSION
spec:
  serviceName: golden-varnish-enterprise
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: varnish-enterprise
      app.kubernetes.io/instance: golden
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: golden
        app.kubernetes.io/name: varnish-enterprise
      annotations:
        checksum/golden-mse4: e868260f72f01987df6f24d0842897d58589a80a5f08ee0f06d0f2a7134d3a4c
        checksum/golden-tls: 50f7b62aaa3af5ec74b343ed5e0f9156f95fbdaded43ddb690f4f7711f1172bb
    spec:
      serviceAccountName: golden-varnish-enterprise
      securityContext:
        fsGroup: 999
      shareProcessNamespace: false
      containers:
        - name: varnish-enterprise
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "quay.io/varnish-software/varnish-plus:APP_VERSION"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6081
              protocol: TCP
            - name: https
              containerPort: 6443
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 6081
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 6081
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          env:
            - name: VARNISH_CONTROLLER_AGENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VARNISH_CLUSTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cluster-token
                  key: token
            - name: VARNISH_CLUSTER_PEER_DOMAIN
              value: "golden-varnish-enterprise-peers:6081"
            - name: VARNISH_CLUSTER_TRACE
              value: "true"
            - name: VARNISH_CLUSTER_PRIMARIES
              value: "3"
            - name: VARNISH_CLUSTER_FALLBACK
              value: "0"
          command:
            - /usr/sbin/varnishd
            - -F
            - -T
            - 127.0.0.1:6082
            - -I
            - /var/lib/varnish-controller/varnish-controller-agent/$(VARNISH_CONTROLLER_AGENT_NAME)/cmds.cli
            - -f
            - /etc/varnish/wrapped-default.vcl
            - -p
            - thread_pool_min=50
            - -p
            - thread_pool_max=1000
            - -p
            - default_ttl=60
            - -a
            - http=0.0.0.0:6081
            - -S
            - /etc/varnish/shared/secret
            - -s
            - mse4,/etc/varnish/mse4.conf
            - -A
            - /etc/varnish/tls.conf
          volumeMounts:
            - name: golden-varnish-vsm
              mountPath: /var/lib/varnish
            - name: golden-config-shared
              mountPath: /etc/varnish/shared
            - name: varnish-license-volume
              mountPath: /etc/varnish/varnish-enterprise.lic
              readOnly: true
              subPath: varnish-enterprise.lic
            - name: golden-config-mse4
              mountPath: /etc/varnish/mse4.conf
              subPath: mse4.conf
            - name: golden-config-tls
              mountPath: /etc/varnish/tls.conf
              subPath: tls.conf
            - name: golden-config-vcl-wrapped-default-vcl
              mountPath: "/etc/varnish/wrapped-default.vcl"
              subPath: "wrapped-default.vcl"
            - name: golden-mse4
              mountPath: /var/lib/mse4
            - name: golden-varnish-controller
              mountPath: /var/lib/varnish-controller
        - name: varnish-enterprise-ncsa
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "quay.io/varnish-software/varnish-plus:APP_VERSION"
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/varnishncsa"]
          args:
            - -c
          env:
            - name: VSM_NOPID
              value: "1"
          volumeMounts:
            - name: golden-varnish-vsm
              mountPath: /var/lib/varnish
            - name: golden-config-shared
              mountPath: /etc/varnish/shared
        - name: varnish-enterprise-otel
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "quay.io/varnish-software/varnish-plus:APP_VERSION"
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/varnish-otel"]
          volumeMounts:
            - name: golden-varnish-vsm
              mountPath: /var/lib/varnish
            - name: golden-config-shared
              mountPath: /etc/varnish/shared
        - name: varnish-enterprise-agent
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "quay.io/varnish-software/varnish-controller-agent:7.5.1-6.0.16r13"
          imagePullPolicy: IfNotPresent
          env:
            - name: VARNISH_CONTROLLER_VARNISH_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VARNISH_CONTROLLER_VARNISH_ADMIN_HOST
              value: "127.0.0.1"
            - name: VARNISH_CONTROLLER_VARNISH_ADMIN_PORT
              value: "6082"
            - name: VARNISH_CONTROLLER_VARNISH_SECRET
              value: /etc/varnish/shared/secret
            - name: VARNISH_CONTROLLER_VARNISH_PORT
              value: "6081"
            - name: VARNISH_CONTROLLER_AGENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VARNISH_CONTROLLER_NATS_USER
              value: varnish-controller
            - name: VARNISH_CONTROLLER_NATS_HOST
              value: "varnish-controller-nats.default.svc.cluster.local:4222"
            - name: VARNISH_CONTROLLER_NATS_PASS
              valueFrom:
                secretKeyRef:
                  name: "varnish-controller-credentials"
                  key: "nats-varnish-password"
            - name: VARNISH_CONTROLLER_NATS_SERVER
              value: "$(VARNISH_CONTROLLER_NATS_USER):$(VARNISH_CONTROLLER_NATS_PASS)@$(VARNISH_CONTROLLER_NATS_HOST)"
            - name: VARNISH_CONTROLLER_BASE_URL
              value: "http://$(VARNISH_CONTROLLER_VARNISH_HOST):6081"
          command: ["/usr/bin/varnish-controller-agent"]
          volumeMounts:
            - name: golden-varnish-vsm
              mountPath: /var/lib/varnish
            - name: golden-config-shared
              mountPath: /etc/varnish/shared
            - name: golden-varnish-controller
              mountPath: /var/lib/varnish-controller
        - name: varnish-enterprise-vcli
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "quay.io/varnish-software/varnish-controller-cli:7.5.1"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              vcli login || exit 1
              sleep inf
          env:
            - name: VARNISH_CONTROLLER_CLI_ENDPOINT
              value: "http://varnish-controller-apigw.default.svc.cluster.local:8080"
            - name: VARNISH_CONTROLLER_CLI_USERNAME
              value: "admin"
            - name: VARNISH_CONTROLLER_CLI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "varnish-controller-credentials"
                  key: "varnish-admin-password"
            - name: VARNISH_CONTROLLER_AGENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: golden-config-shared
              mountPath: /etc/varnish/shared
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    vcli login
                    while true; do
                      echo >&2 "Waiting for Varnish Controller Agent to shutdown..."
                      if vcli agent list -f "name=${VARNISH_CONTROLLER_AGENT_NAME},state=3" 2>/dev/null; then
                        agentId=$(vcli agent list --csv -f "name=${VARNISH_CONTROLLER_AGENT_NAME},state=3" | tail -n1 | cut -d, -f1)
                        echo "Removing ${VARNISH_CONTROLLER_AGENT_NAME} from Varnish Controller"
                        vcli agent delete -y "${agentId}"
                        break
                      fi
                      sleep 1
                    done
      initContainers:
        - name: varnish-enterprise-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "quay.io/varnish-software/varnish-plus:APP_VERSION"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - umask 077; test -s /etc/varnish/shared/secret || head -c 32 /dev/urandom > /etc/varnish/shared/secret
          volumeMounts:
            - name: golden-config-shared
              mountPath: /etc/varnish/shared
        - name: mse4-config
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "quay.io/varnish-software/varnish-plus:APP_VERSION"
          imagePullPolicy: IfNotPresent
          command:
           - mkfs.mse4
           - -c
           - /etc/varnish/mse4.conf
           - configure
          volumeMounts:
           - name: golden-mse4
             mountPath: /var/lib/mse4
           - name: golden-config-mse4
             mountPath: /etc/varnish/mse4.conf
             subPath: mse4.conf
      volumes:
      - name: golden-varnish-vsm
        emptyDir:
          medium: "Memory"
      - name: golden-config-shared
        emptyDir:
          medium: "Memory"
      - name: varnish-license-volume
        secret:
          secretName: varnish-license
      - name: golden-config-mse4
        configMap:
          name: golden-varnish-enterprise-mse4
      - name: golden-config-tls
        configMap:
          name: golden-varnish-enterprise-tls
      - name: golden-config-vcl-wrapped-default-vcl
        configMap:
          name: golden-varnish-enterprise-vcl-wrapped-default-vcl
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: varnish-enterprise
                  app.kubernetes.io/instance: golden
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 45
  volumeClaimTemplates:
    - metadata:
        name: golden-varnish-controller
        labels:
          helm.sh/chart: varnish-enterprise-CHART_VERSION
          app.kubernetes.io/name: varnish-enterprise
          app.kubernetes.io/instance: golden
          app.kubernetes.io/version: "APP_VERSION"
          app.kubernetes.io/managed-by: Helm
        annotations:
          golden/agent-pvc: "true"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "512Mi"
    - metadata:
        name: golden-mse4
        labels:
          helm.sh/chart: varnish-enterprise-CHART_VERSION
          app.kubernetes.io/name: varnish-enterprise
          app.kubernetes.io/instance: golden
          app.kubernetes.io/version: "APP_VERSION"
          app.kubernetes.io/managed-by: Helm
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "20Gi"
