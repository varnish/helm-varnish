# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# The varnish-enterprise image ships both `broadcaster` and `varnish-discovery`.
image:
  repository: docker.io/varnish/varnish-enterprise
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  # varnish-discovery needs them to watch the endpoints.
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Creates a Role/RoleBinding allowing the service account to watch endpoints
# in the release namespace. Disable if you manage RBAC yourself.
rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Broadcaster is exposed on port 80 (container port 8088), or only on port 443
# (container port 8443) if `broadcaster.tls` is enabled. The management port (8089) is exposed if `broadcaster.mgmt.enabled`.
service:
  type: ClusterIP

# Resources for the broadcaster container, see `discovery.resources` for the
# discovery containers.
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# By default (null), the probes ping the management interface on
# localhost:8089/api/ping, over HTTPS if TLS is enabled. Set them to override
# the default, or to {} to disable them.
livenessProbe: null
readinessProbe: null

broadcaster:
  # Request timeout between the broadcaster and the Varnish nodes.
  timeout: 10s
  # One of DEBUG, INFO, WARNING, ERROR, QUIET.
  logLevel: INFO
  # Return immediately with a X-Job-Id header instead of waiting for the nodes.
  async: false
  # The management interface (port 8089) always runs, but only listens on
  # 127.0.0.1 unless enabled here, in which case it's also added to the Service.
  mgmt:
    enabled: false
  # Serve HTTPS on port 443 using a kubernetes.io/tls secret (tls.crt/tls.key).
  # Broadcaster then stops serving plain HTTP, and the management
  # interface is also served over HTTPS.
  tls:
    enabled: false
    secret: ""
  # Extra arguments passed to broadcaster, e.g. ["-tls-verify", "NONE"].
  extraArgs: []

discovery:
  # Names of the Services (as listed by `kubectl get endpoints`) in the release
  # namespace pointing to the Varnish pods. Each one becomes a group that can
  # be targeted using the X-Broadcast-Group header.
  groups: []
  # Port used to reach the Varnish pods, 0 uses the first port of the endpoint.
  port: 0
  # Protocol used to reach the Varnish pods (http or https).
  proto: http
  # Extra arguments passed to varnish-discovery, e.g. ["-every", "10s"].
  extraArgs: []
  resources: {}

# Sets the extra environment variables for broadcaster. Can be set as either
# an object, a list, or a templated string.
extraEnvs: {}
#extraEnvs:
#  MY_ENV_VAR: value
#  MY_OTHER_ENV_VAR: other_value
#
#extraEnvs:
#  - name: MY_ENV_VAR
#    value: value

nodeSelector: {}

tolerations: []

affinity: {}
