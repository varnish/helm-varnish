{{- if eq .Values.server.kind "StatefulSet" }}
{{- if .Values.server.strategy }}
{{- fail "'server.strategy' cannot be enabled when 'server.kind' is 'StatefulSet'" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "varnish.fullname" . }}
  {{- include "varnish.serverLabels" . | nindent 2 }}
  {{- include "varnish.serverAnnotations" . | nindent 2 }}
spec:
  serviceName: {{ include "varnish.fullname" . }}
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicas }}
  {{- end }}
  {{- include "varnish.updateStrategy" . | indent 2 }}
  selector:
    matchLabels:
      {{- include "varnish.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "varnish.podLabels" . | nindent 6 }}
      {{- include "varnish.podAnnotations" . | nindent 6 }}
    spec:
      {{- include "varnish.podImagePullSecrets" . | indent 6 }}
      {{- include "varnish.podServiceAccount" . | indent 6 }}
      {{- include "varnish.podSecurityContext" . | indent 6 }}
      shareProcessNamespace: {{ .Values.server.shareProcessNamespace | toJson }}
      containers:
        {{- include "varnish.serverContainer" . | indent 8 }}
        {{- include "varnish.ncsaContainer" . | indent 8 }}
        {{- include "varnish.otelContainer" . | indent 8 }}
        {{- include "varnish.agentContainer" . | indent 8 }}
        {{- include "varnish.vcliContainer" . | indent 8 }}
        {{- include "varnish.extraContainers" . | indent 8 }}
      {{- if .Values.server.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- include "varnish.initContainers" . | indent 6 }}
      {{- include "varnish.podVolumes" . | indent 6 }}
      {{- include "varnish.nodeSelector" . | indent 6 }}
      {{- include "varnish.affinity" . | indent 6 }}
      {{- include "varnish.tolerations" . | indent 6 }}
      {{- include "varnish.terminationGracePeriodSeconds" . | indent 6 }}
  {{- $msePersistenceEnabled := (and (include "varnish.mseEnabled" .) .Values.server.mse.persistence.enabled) }}
  {{- $mse4PersistenceEnabled := (and (include "varnish.mse4Enabled" .) .Values.server.mse4.persistence.enabled) }}
  {{- $agentPersistenceEnabled := (and (include "varnish.isEnterprise" .) .Values.server.agent.persistence.enabled (eq .Values.server.agent.persistence.enableWithVolumeName "")) }}
  {{- $extraVolumeClaimsEnabled := (not (empty .Values.server.extraVolumeClaimTemplates)) }}
  {{- if or $msePersistenceEnabled $mse4PersistenceEnabled $agentPersistenceEnabled $extraVolumeClaimsEnabled }}
  volumeClaimTemplates:
  {{- if $agentPersistenceEnabled }}
    - metadata:
        name: {{ .Release.Name }}-varnish-controller
        labels:
          {{- include "varnish.labels" . | nindent 10 }}
          {{- include "varnish.agentPvcLabels" . | indent 10 }}
      spec:
        {{- if not (eq .Values.server.agent.persistence.storageClassName "") }}
        storageClassName: {{ .Values.server.agent.persistence.storageClassName | quote }}
        {{- end }}
        {{- with .Values.server.agent.persistence.accessModes }}
        accessModes:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if not (eq .Values.server.agent.persistence.storageSize "") }}
        resources:
          requests:
            storage: {{ .Values.server.agent.persistence.storageSize | quote }}
        {{- end }}
  {{- end }}
  {{- if $msePersistenceEnabled }}
    - metadata:
        name: {{ .Release.Name }}-mse
        labels:
          {{- include "varnish.labels" . | nindent 10 }}
          {{- include "varnish.msePvcLabels" . | indent 10 }}
        {{- include "varnish.mseAnnotations" . | indent 8 }}
      spec:
        {{- if not (eq .Values.server.mse.persistence.storageClassName "") }}
        storageClassName: {{ .Values.server.mse.persistence.storageClassName | quote }}
        {{- end }}
        {{- with .Values.server.mse.persistence.accessModes }}
        accessModes:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if not (eq .Values.server.mse.persistence.storageSize "") }}
        resources:
          requests:
            storage: {{ .Values.server.mse.persistence.storageSize | quote }}
        {{- end }}
  {{- end }}
  {{- if $mse4PersistenceEnabled }}
    - metadata:
        name: {{ .Release.Name }}-mse4
        labels:
          {{- include "varnish.labels" . | nindent 10 }}
          {{- include "varnish.mse4PvcLabels" . | indent 10 }}
        {{- include "varnish.mse4Annotations" . | indent 8 }}
      spec:
        {{- if not (eq .Values.server.mse4.persistence.storageClassName "") }}
        storageClassName: {{ .Values.server.mse4.persistence.storageClassName | quote }}
        {{- end }}
        {{- with .Values.server.mse4.persistence.accessModes }}
        accessModes:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if not (eq .Values.server.mse4.persistence.storageSize "") }}
        resources:
          requests:
            storage: {{ .Values.server.mse4.persistence.storageSize | quote }}
        {{- end }}
  {{- end }}
  {{- if $extraVolumeClaimsEnabled }}
    {{- $tp := kindOf .Values.server.extraVolumeClaimTemplates }}
    {{- if eq $tp "string" }}
      {{- tpl .Values.server.extraVolumeClaimTemplates . | trim | nindent 4 }}
    {{- else }}
      {{- toYaml .Values.server.extraVolumeClaimTemplates | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
