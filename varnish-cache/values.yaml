    # Type: string
    clusterIP: ""

    # Sets a pre-allocated IP address for use in LoadBalancer.
    # Type: string
    loadBalancerIP: ""

    # Enables or disables the Varnish HTTP service.
    # Type: object
    http:
      # Enables HTTP service. Requires `server.http.enabled`.
      # Type: boolean
      enabled: true

      # Sets the port to expose HTTP service.
      # Type: number
      port: 80

      # Sets the port to expose HTTP service directly on the node itself. Only applicable
      # when `server.service.type` is set to NodePort. This value must be within the
      # Kubernetes service-node-port-range (default: 30000-32767).
      #
      # See also [Accessing Varnish Enterprise in Kubernetes
      # Cluster](https://docs.varnish-software.com/varnish-helm/guides/accessing-varnish-enterprise/).
      # Type: number
      #nodePort: 30080

    # Enables or disables the Varnish HTTPS service.
    # Type: object
    https:
      # Enables HTTPS service. Requires `server.tls.enabled`.
      # Type: boolean
      enabled: false

      # Sets the port to expose HTTPS service.
      # Type: number
      port: 443

      # Sets the port to expose HTTPS service directly on the node itself. Only applicable
      # when `server.service.type` is set to NodePort. This value must be within the
      # Kubernetes service-node-port-range (default: 30000-32767).
      #
      # See also [accessing Varnish via
      # NodePort](https://docs.varnish-software.com/varnish-helm/guides/accessing-varnish-enterprise/#nodeport).
      # Type: number
      #nodePort: 30443

    # An array of extra services to expose via the Service. Each extra service adds a port
    # named `extra-<name>` to the Service.
    # Type: array of objects
