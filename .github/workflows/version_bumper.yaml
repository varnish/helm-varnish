name: Chart version bumper

# This job opens a PR to bump the appVersion in Helm charts when a new version
# of the underlying application is detected.

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  repository_dispatch:
    types:
      - bump_version

jobs:
  version_bump:
    name: Chart appVersion bump (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        # Charts in the same group share one version: they are checked
        # together, and a single PR bumps the appVersion of each outdated
        # chart and the version of every chart in the group.
        # varnish-cache and varnish-enterprise share their templates and must
        # keep the same version (checked in ci.yml).
        group:
          - name: 'orca-chart'
            charts:
              - chart_dir: 'orca-chart'
                docker_image: 'varnish/orca:latest'
                version_command: 'varnish-supervisor --version | head -n 1'
          - name: 'varnish'
            charts:
              - chart_dir: 'varnish-enterprise'
                docker_image: 'varnish/varnish-enterprise:latest'
                version_command: varnishd -V 2>&1 | sed -En 's/.*varnish-plus-(\S+).*/\1/p'
              - chart_dir: 'varnish-cache'
                docker_image: 'docker.io/varnish:latest'
                version_command: varnishd -V 2>&1 | sed -En 's/.*\(varnish-([0-9][^ ]*) revision.*/\1/p'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and compare appVersions
        id: version_check
        env:
          CHARTS: ${{ toJSON(matrix.group.charts) }}
        run: |
          set -ex

          CHART_DIRS=""
          UPDATES=""
          CURRENT_CHART_VERSION=""
          for i in $(seq 0 $(($(jq length <<< "$CHARTS") - 1))); do
            CHART_DIR=$(jq -r ".[$i].chart_dir" <<< "$CHARTS")
            DOCKER_IMAGE=$(jq -r ".[$i].docker_image" <<< "$CHARTS")
            VERSION_CMD=$(jq -r ".[$i].version_command" <<< "$CHARTS")
            CHART_PATH="$CHART_DIR/Chart.yaml"
            CHART_DIRS="$CHART_DIRS $CHART_DIR"

            # Get current appVersion and chart version using yq
            CURRENT_APP_VERSION=$(yq '.appVersion' "$CHART_PATH" | xargs)
            CHART_VERSION=$(yq '.version' "$CHART_PATH")

            # The patch bump needs three numbers. A failed $(( )) survives set -e,
            # so without this the PR step would push a version like "1.8.".
            if [[ ! "$CHART_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error file=$CHART_PATH::version '$CHART_VERSION' is not X.Y.Z."
              exit 1
            fi
            if [ -n "$CURRENT_CHART_VERSION" ] && [ "$CHART_VERSION" != "$CURRENT_CHART_VERSION" ]; then
              echo "::error file=$CHART_PATH::version '$CHART_VERSION' differs from '$CURRENT_CHART_VERSION' in the same group."
              exit 1
            fi
            CURRENT_CHART_VERSION="$CHART_VERSION"

            # Get latest app version
            LATEST_APP_VERSION=$(docker run --rm "$DOCKER_IMAGE" sh -c "$VERSION_CMD" | xargs)

            # Anything but a bare version means the command's output format
            # changed, and it would end up in a branch name and in appVersion.
            if [[ ! "$LATEST_APP_VERSION" =~ ^[0-9A-Za-z._+-]+$ ]]; then
              echo "::error::$DOCKER_IMAGE reported '$LATEST_APP_VERSION', which is not a version."
              exit 1
            fi

            echo "Chart $CHART_DIR: appVersion $CURRENT_APP_VERSION, latest $LATEST_APP_VERSION, version $CHART_VERSION"

            if [ "$LATEST_APP_VERSION" != "$CURRENT_APP_VERSION" ]; then
              echo "New appVersion $LATEST_APP_VERSION available for $CHART_DIR."
              UPDATES="$UPDATES $CHART_DIR=$LATEST_APP_VERSION"
            fi
          done

          # Set environment variables for the next steps
          {
            echo "CHART_DIRS=${CHART_DIRS# }"
            echo "UPDATES=${UPDATES# }"
            echo "CURRENT_CHART_VERSION=$CURRENT_CHART_VERSION"
          } >> "$GITHUB_ENV"

          if [ -n "$UPDATES" ]; then
            echo "version_match=false" >> "$GITHUB_OUTPUT"
          else
            echo "All charts are up-to-date. No action needed."
            echo "version_match=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR to update appVersions and chart versions
        if: steps.version_check.outputs.version_match == 'false'
        run: |
          set -ex

          # 1. Calculate New Chart Patch Version
          # Split version (X.Y.Z), increment Z (patch), then join back.
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_CHART_VERSION"
          NEW_CHART_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "New chart version calculated: $NEW_CHART_VERSION"

          BRANCH="auto-pr"
          SUMMARY=""
          for update in $UPDATES; do
            BRANCH="$BRANCH-${update%%=*}-appversion-${update#*=}"
            SUMMARY="$SUMMARY, ${update%%=*} appVersion to ${update#*=}"
          done
          SUMMARY="${SUMMARY#, }"

          if git ls-remote --exit-code origin "$BRANCH"; then
            echo "Branch $BRANCH already exists, bailing out."
            exit 0
          fi

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git switch main
          git switch -c "$BRANCH"

          # 2. Use yq to safely update appVersion and Chart version
          # yq is more reliable than sed for YAML files.
          for update in $UPDATES; do
            yq -i ".appVersion = \"${update#*=}\"" "${update%%=*}/Chart.yaml"
          done
          for chart in $CHART_DIRS; do
            yq -i ".version = \"$NEW_CHART_VERSION\"" "$chart/Chart.yaml"
            git add "$chart/Chart.yaml"
          done

          git commit -m "Bump $SUMMARY and chart version to $NEW_CHART_VERSION"
          git push origin "$BRANCH"

          gh pr create \
            --title "Bump $SUMMARY (Chart $NEW_CHART_VERSION)" \
            --body "Automated PR to bump $SUMMARY, and the chart \`version\` of ${CHART_DIRS// /, } to \`$NEW_CHART_VERSION\`." \
            --base main \
            --head "$BRANCH"
