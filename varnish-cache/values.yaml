    # Type: number
    periodSeconds: 10

    # Sets the timeout for the probe to wait for a response from the Varnish Cache Pod.
    # Type: number
    timeoutSeconds: 5

    # Sets the number of times when a consecutive successful response is considered a
    # success and the Varnish Cache Pod is considered still ready to accept an incoming
    # connection.
    # Type: number
    successThreshold: 1

    # Sets the number of times when a consecutive failure response is considered a failure
    # and the Varnish Cache Pod is considered unhealthy (i.e., down).
    # Type: number
    failureThreshold: 3

