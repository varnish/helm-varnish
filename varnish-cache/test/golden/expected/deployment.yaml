---
# Source: varnish-cache/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: golden-varnish-cache
  labels:
    helm.sh/chart: varnish-cache-CHART_VERSION
    app.kubernetes.io/name: varnish-cache
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "APP_VERSION"
    app.kubernetes.io/managed-by: Helm
---
# Source: varnish-cache/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: golden-varnish-cache
  labels:
    helm.sh/chart: varnish-cache-CHART_VERSION
    app.kubernetes.io/name: varnish-cache
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "APP_VERSION"
    app.kubernetes.io/managed-by: Helm
spec:
  type: NodePort
  internalTrafficPolicy: Cluster
  externalTrafficPolicy: Cluster
  ports:
    - name: http
      port: 80
      targetPort: 6081
  selector:
    app.kubernetes.io/name: varnish-cache
    app.kubernetes.io/instance: golden
---
# Source: varnish-cache/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-varnish-cache
  labels:
    app.kubernetes.io/instance: golden
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: varnish-cache
    app.kubernetes.io/version: APP_VERSION
    helm.sh/chart: varnish-cache-CHART_VERSION
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: varnish-cache
      app.kubernetes.io/instance: golden
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: golden
        app.kubernetes.io/name: varnish-cache
    spec:
      serviceAccountName: golden-varnish-cache
      securityContext:
        fsGroup: 1000
      shareProcessNamespace: false
      containers:
        - name: varnish-cache
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          image: "docker.io/varnish:APP_VERSION"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6081
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 6081
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 6081
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VARNISH_WORKDIR
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - /usr/sbin/varnishd
            - -F
            - -T
            - 127.0.0.1:6082
            - -f
            - /etc/varnish/default.vcl
            - -p
            - thread_pool_max=1000
            - -p
            - thread_pool_min=50
            - -p
            - thread_pool_timeout=120
            - -n
            - $(VARNISH_WORKDIR)
            - -t
            - "120"
            - -a
            - http=$(POD_IP):6081
          volumeMounts:
            - name: golden-varnish-vsm
              mountPath: /var/lib/varnish
            - name: golden-config-shared
              mountPath: /etc/varnish/shared
        - name: varnish-cache-ncsa
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          image: "docker.io/varnish:APP_VERSION"
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/varnishncsa"]
          args:
            - -n
            - $(VARNISH_WORKDIR)
            - -c
          env:
            - name: VSM_NOPID
              value: "1"
            - name: VARNISH_WORKDIR
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "/usr/bin/varnishncsa -d -t3 -n \"$VARNISH_WORKDIR\""
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "/usr/bin/varnishncsa -d -t3 -n \"$VARNISH_WORKDIR\""
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          volumeMounts:
            - name: golden-varnish-vsm
              mountPath: /var/lib/varnish
            - name: golden-config-shared
              mountPath: /etc/varnish/shared
      volumes:
      - name: golden-varnish-vsm
        emptyDir:
          medium: "Memory"
      - name: golden-config-shared
        emptyDir:
          medium: "Memory"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: varnish-cache
                  app.kubernetes.io/instance: golden
              topologyKey: kubernetes.io/hostname
