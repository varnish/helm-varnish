      # Type: number
      periodSeconds: 10

      # Sets the timeout for the probe to wait for a response from the varnishncsa Pod.
      # Type: number
      timeoutSeconds: 5

      # Sets the number of times when a consecutive successful response is considered a
      # success and the varnishncsa Pod is considered still ready to handle the logs.
      # Type: number
      successThreshold: 1

      # Sets the number of times when a consecutive failure response is considered a
