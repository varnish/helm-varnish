  # starts. Note that `initContainers` cannot be changed once it is applied. To update
  # this value after the initial deploy, uninstall Varnish Enterprise Helm Chart from the
  # cluster and reinstall. The value can be set as either an array of objects or a
  # template string.
  # Type: array or template string
  # Example:
  #   extraInitContainers: |
  #     - name: varnish-setup-tls
  #       securityContext:
  #         {{- toYaml .Values.global.securityContext | nindent 4 }}
  #       image: debian:latest
  #       command:
  #         - sh -c "sleep 3600"
  extraInitContainers: []

  # An array of objects that conforms to the Kubernetes
  # [containers](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#PodSpec)
