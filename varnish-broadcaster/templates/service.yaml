apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm.fullname" . }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if .Values.broadcaster.tls.enabled }}
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
    {{- else }}
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
    {{- end }}
    {{- if .Values.broadcaster.mgmt.enabled }}
    - port: 8089
      targetPort: mgmt
      protocol: TCP
      name: mgmt
    {{- end }}
  selector:
    {{- include "helm.selectorLabels" . | nindent 4 }}
