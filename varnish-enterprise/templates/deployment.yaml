{{- if eq .Values.server.kind "Deployment" }}
{{- if .Values.server.updateStrategy }}
{{- fail "'server.updateStrategy' cannot be enabled when 'server.kind' is 'Deployment'" }}
{{- end }}
{{- if .Values.server.mse.persistence.enabled }}
{{- fail "'server.mse.persistence.enabled' cannot be enabled when 'server.kind' is 'Deployment'" }}
{{- end }}
{{- if .Values.server.mse4.persistence.enabled }}
{{- fail "'server.mse4.persistence.enabled' cannot be enabled when 'server.kind' is 'Deployment'" }}
{{- end }}
{{- if .Values.server.agent.persistence.enabled }}
{{- fail "'server.agent.persistence.enabled' cannot be enabled when 'server.kind' is 'Deployment'" }}
{{- end }}
{{- if not (empty .Values.server.extraVolumeClaimTemplates) }}
{{- fail "'server.extraVolumeClaimTemplates' cannot be enabled when 'server.kind' is 'Deployment'" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "varnish.fullname" . }}
  {{- include "varnish.serverLabels" . | nindent 2 }}
  {{- include "varnish.serverAnnotations" . | nindent 2 }}
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicas }}
  {{- end }}
  {{- include "varnish.strategy" . | indent 2 }}
  selector:
    matchLabels:
      {{- include "varnish.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "varnish.podLabels" . | nindent 6 }}
      {{- include "varnish.podAnnotations" . | nindent 6 }}
    spec:
      {{- include "varnish.podImagePullSecrets" . | indent 6 }}
      {{- include "varnish.podServiceAccount" . | indent 6 }}
      {{- include "varnish.podSecurityContext" . | indent 6 }}
      shareProcessNamespace: {{ .Values.server.shareProcessNamespace | toJson }}
      containers:
        {{- include "varnish.serverContainer" . | indent 8 }}
        {{- include "varnish.ncsaContainer" . | indent 8 }}
        {{- include "varnish.otelContainer" . | indent 8 }}
        {{- include "varnish.agentContainer" . | indent 8 }}
        {{- include "varnish.vcliContainer" . | indent 8 }}
        {{- include "varnish.extraContainers" . | indent 8 }}
      {{- if .Values.server.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- include "varnish.initContainers" . | indent 6 }}
      {{- include "varnish.podVolumes" . | indent 6 }}
      {{- include "varnish.nodeSelector" . | indent 6 }}
      {{- include "varnish.affinity" . | indent 6 }}
      {{- include "varnish.tolerations" . | indent 6 }}
      {{- include "varnish.terminationGracePeriodSeconds" . | indent 6 }}
{{- end }}
