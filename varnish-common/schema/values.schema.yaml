      cmdfileConfig:
        type: string
        x-type-label: template string
        default: ""
        x-since:
          enterprise: v1.2.0
        description: |
          A [CLI command file][varnish-cmdfile] for running management commands when `varnishd` is launched. For example, when loading extra VCL in multi-tenancy mode. See also [External VCL ConfigMap](https://docs.varnish-software.com/varnish-helm/guides/using-external-vcl-configmap/#configmap-for-multiple-vcl-files).
        x-examples:
          - description: "For example:"
            value: |
              vcl.load vcl_tenant1 /etc/varnish/tenant1.vcl
              vcl.label label_tenant1 vcl_tenant1
              vcl.load vcl_main /etc/varnish/main.vcl
              vcl.use vcl_main

      cmdfileConfigFile:
        type: string
        default: ""
        description: |
          Use the content of the given file path as a cmdfile. The file will be parsed as templated string. Will override `server.cmdfileConfig` if set. Note that the file must be placed inside the files/ directory in the Helm chart itself.
        x-examples:
          - description: "For example:"
            value: files/cmds.cli

      baseUrl:
        x-flavor: enterprise
        type: string
        default: ""
        x-since:
          enterprise: v1.4.0
        description: |
          Sets a base URL for Varnish Controller and Varnish Controller Router when performing a HTTP-based routing. If unset, the URL will infer from a Pod IP and `server.http.port`.

      terminationGracePeriodSeconds:
        type: integer
        default: 0
        x-since:
          enterprise: v1.6.0
        description: |
          Sets the termination grace period seconds to wait for {product} to shut down. Once this number of seconds is reached without the {product} Pod shutting down, Kubernetes will send SIGKILL to the Pod. When `server.delayedShutdown` is used, this value should be set to a higher value than the **maximum** time (in seconds) it took for {product} to fully shut down after a delayed shutdown.

          The value to set here depends on the cluster setup. For example, an AWS Load Balancer may still forward requests to Varnish for `deregistration_delay.timeout_seconds` which is set to 300 seconds by default. If `server.delayedShutdown` took 30 seconds, then `server.terminationGracePeriodSeconds` should be set to _at least_ 330 seconds in order to have a zero-downtime during a rolling update or scaling down.

      delayedHaltSeconds:
        x-type-label: number
        anyOf:
          - type: integer
          - type: string
            pattern: "^[0-9]+$"
          - type: "null"
        x-values-example: 0
        x-deprecated: use `server.delayedShutdown` instead.
        description: |
          Delays stopping of the {product} container by the given seconds.

      delayedShutdown:
        type: object
        additionalProperties: false
        description: |
          Configures delayed shutdown for zero-downtime downscaling.
        properties:
          method:
            type: string
            enum: [none, sleep, mempool, shutdown_delay]
            x-enum-flavor:
              shutdown_delay: enterprise
            default: none
            x-since:
              cache: v1.1.0
              enterprise: v1.6.0
            description: |
              Sets the method for delaying the shutdown of {product}. This is useful for rolling updates or when scaling down, where the load balancer component may still attempt to forward requests to the {product} instance when {product} has already received a SIGHUP, leading to HTTP 502 errors.

              Multiple methods are provided here:

              - `sleep` will simply sleep in the `preStop` for `server.delayedShutdown.sleep.seconds` seconds. This is the simplest way to delay the shutdown of {product} when the time taken for the load balancer component to stop forwarding traffic to {product} is largely fixed.
              - `mempool` polls varnishstat for `MEMPOOL.sess` to go down to zero. This allows for the quickest shutdown but requires tuning `server.delayedShutdown.mempool.pollSeconds` to traffic patterns (as `MEMPOOL.sess` may become 0 momentarily, resulting in an early shutdown).

              When `server.delayedShutdown.method` is set to a value other than "none", `server.terminationGracePeriodSeconds` **must** also be set.

          sleep:
            type: object
            additionalProperties: false
            description: |
              Configures the "sleep" delayed shutdown method.
            properties:
              seconds:
                type: [integer, string]
                default: 90
                x-since:
                  cache: v1.1.0
                description: |
                  Sets the number of seconds to sleep before SIGHUP is sent to {product}. Only applicable when `server.delayedShutdown.method` is set to "sleep".

          mempool:
            type: object
            additionalProperties: false
            description: |
              Configures the "mempool" delayed shutdown method.
            properties:
              pollSeconds:
                type: [integer, number, string]
                default: 1
                x-since:
                  cache: v1.1.0
                description: |
                  Sets the number of seconds to poll for `MEMPOOL.sess` stats. Only applicable when `server.delayedShutdown.method` is set to "mempool".

                  This value requires tuning to traffic patterns. If the time between each traffic took more than `server.delayedShutdown.mempool.pollSeconds`, then {product} could be signaled to SIGHUP too early, leading to an HTTP 502 error on the load balancer (as {product} already stopped accepting connection).

              waitSeconds:
                type: [integer, number, string]
                default: 5
                x-since:
                  cache: v1.1.0
                description: |
                  Sets the number of seconds to wait after `MEMPOOL.sess` turned zero. Only applicable when `server.delayedShutdown.method` is set to "mempool".

          shutdownDelay:
            x-flavor: enterprise
            type: object
            additionalProperties: false
            description: |
              Configures the "shutdown_delay" delayed shutdown method. It is similar to `sleep`, but uses the `shutdown_delay` feature of {product} (6.0.13r2 and newer) to perform the wait in-engine instead of relying on `preStop` and an external command.
            properties:
              seconds:
                type: [integer, string]
                default: 90
                description: |
                  Sets the number of seconds to delay the shutdown in-engine. Only applicable when `server.delayedShutdown.method` is set to "shutdown_delay".

      image:
        allOf:
          - $ref: "#/definitions/image"
        description: |
          Sets the image and tag to use to deploy {product}.
        properties:
          repository:
            type: string
            x-default:
              cache: docker.io/varnish
              enterprise: quay.io/varnish-software/varnish-plus
            description: |
              Sets the repository for {product} image.

          pullPolicy:
            $ref: "#/definitions/pullPolicy"
            default: IfNotPresent
            description: |
              Sets the [imagePullPolicy][k8s-pod-v1-containers] for the {product} image. This can be one of Always, Never, or IfNotPresent.

          tag:
            type: [string, integer, number]
            default: ""
            x-default-text: _same as appVersion_
            description: |
              Sets the tag for the {product} image. By default, this is set to the same application version as in the {product} Helm Chart. If the tag is set to non-exact versions (such as "latest"), make sure to set `server.image.pullPolicy` to "Always" to make sure the image is always updated.

      autoscaling:
        type: object
        additionalProperties: false
        description: |
          An object for configuring [HorizontalPodAutoscaling][k8s-hpa].
        properties:
          enabled:
            type: boolean
            default: false
            description: |
              Enables the [HorizontalPodAutoscaling][k8s-hpa] with the {product} Pod. `server.replicas` is ignored if autoscaling is enabled.

          minReplicas:
            $ref: "#/definitions/intOrDash"
            x-default:
              cache: 1
              enterprise: "-"
            description: |
              Sets the minimum number of replicas to always keep running. When set to "-", the value of `server.replicas` is used.

