apiVersion: v1
kind: ServiceAccount
metadata:
  name: golden-varnish-enterprise
  labels:
    helm.sh/chart: varnish-enterprise-CHART_VERSION
    app.kubernetes.io/name: varnish-enterprise
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "APP_VERSION"
    app.kubernetes.io/managed-by: Helm
---
# Source: varnish-enterprise/templates/configmap-vcl.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-varnish-enterprise-vcl-bundle-router
  labels:
    helm.sh/chart: varnish-enterprise-CHART_VERSION
    app.kubernetes.io/name: varnish-enterprise
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "APP_VERSION"
    app.kubernetes.io/managed-by: Helm
data:
  router.vcl: |
    vcl 4.1;
    backend default none;
    sub vcl_recv {
      set req.http.No-Port-Host = regsub(req.http.host, ":\d+$", "");
      # foo: foo.example.com
      if (req.http.No-Port-Host == "foo.example.com") {
        return(vcl(foo));
      }
      # any: catch-all
      return(vcl(any));
    }
---
# Source: varnish-enterprise/templates/configmap-vcl.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-varnish-enterprise-vcl-bundle-cmds
  labels:
    helm.sh/chart: varnish-enterprise-CHART_VERSION
    app.kubernetes.io/name: varnish-enterprise
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "APP_VERSION"
    app.kubernetes.io/managed-by: Helm
data:
  cmds.cli: |
    vcl.load route_foo_0 /etc/varnish/vcls/foo.vcl
    vcl.label foo route_foo_0
    vcl.load route_any_0 /etc/varnish/vcls/any.vcl
    vcl.label any route_any_0
    vcl.load router_0 /etc/varnish/vcls/router.vcl
    vcl.use router_0
---
# Source: varnish-enterprise/templates/configmap-vcl.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-varnish-enterprise-vcl-bundle-foo
  labels:
    helm.sh/chart: varnish-enterprise-CHART_VERSION
    app.kubernetes.io/name: varnish-enterprise
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "APP_VERSION"
    app.kubernetes.io/managed-by: Helm
data:
  foo.vcl: |
    vcl 4.1;
    include "./helpers.vcl";
    backend default none;
    sub vcl_recv { call common_recv; return (synth(200)); }
