  # extra VCL in multi-tenancy mode. See also [External VCL
  # ConfigMap](https://docs.varnish-software.com/varnish-helm/guides/using-external-vcl-configmap/#configmap-for-multiple-vcl-files).
  # Type: template string
  # Example:
  #   cmdfileConfig: |
  #     vcl.load vcl_tenant1 /etc/varnish/tenant1.vcl
  #     vcl.label label_tenant1 vcl_tenant1
  #     vcl.load vcl_main /etc/varnish/main.vcl
  #     vcl.use vcl_main
  cmdfileConfig: ""

  # Use the content of the given file path as a cmdfile. The file will be parsed as
  # templated string. Will override `server.cmdfileConfig` if set. Note that the file must
  # be placed inside the files/ directory in the Helm chart itself.
  # Type: string
  # Example:
  #   cmdfileConfigFile: files/cmds.cli
  cmdfileConfigFile: ""

  # Sets the termination grace period seconds to wait for Varnish Cache to shut down. Once
  # this number of seconds is reached without the Varnish Cache Pod shutting down,
  # Kubernetes will send SIGKILL to the Pod. When `server.delayedShutdown` is used, this
  # value should be set to a higher value than the **maximum** time (in seconds) it took
  # for Varnish Cache to fully shut down after a delayed shutdown.
  #
  # The value to set here depends on the cluster setup. For example, an AWS Load Balancer
  # may still forward requests to Varnish for `deregistration_delay.timeout_seconds` which
  # is set to 300 seconds by default. If `server.delayedShutdown` took 30 seconds, then
  # `server.terminationGracePeriodSeconds` should be set to _at least_ 330 seconds in
  # order to have a zero-downtime during a rolling update or scaling down.
  # Type: number
  terminationGracePeriodSeconds: 0

  # Deprecated: use `server.delayedShutdown` instead.
  #
  # Delays stopping of the Varnish Cache container by the given seconds.
  # Type: number
  #delayedHaltSeconds: 0

  # Configures delayed shutdown for zero-downtime downscaling.
  # Type: object
  delayedShutdown:
    # Sets the method for delaying the shutdown of Varnish Cache. This is useful for
    # rolling updates or when scaling down, where the load balancer component may still
    # attempt to forward requests to the Varnish Cache instance when Varnish Cache has
    # already received a SIGHUP, leading to HTTP 502 errors.
    #
    # Multiple methods are provided here:
    #
    # - `sleep` will simply sleep in the `preStop` for `server.delayedShutdown.sleep.seconds` seconds. This is the simplest way to delay the shutdown of Varnish Cache when the time taken for the load balancer component to stop forwarding traffic to Varnish Cache is largely fixed.
    # - `mempool` polls varnishstat for `MEMPOOL.sess` to go down to zero. This allows for the quickest shutdown but requires tuning `server.delayedShutdown.mempool.pollSeconds` to traffic patterns (as `MEMPOOL.sess` may become 0 momentarily, resulting in an early shutdown).
    #
    # When `server.delayedShutdown.method` is set to a value other than "none",
    # `server.terminationGracePeriodSeconds` **must** also be set.
    # Type: string, one of `none`, `sleep`, or `mempool`
    # Availability: v1.1.0
    method: "none"

    # Configures the "sleep" delayed shutdown method.
    # Type: object
    sleep:
      # Sets the number of seconds to sleep before SIGHUP is sent to Varnish Cache. Only
      # applicable when `server.delayedShutdown.method` is set to "sleep".
      # Type: number or string
      # Availability: v1.1.0
      seconds: 90

    # Configures the "mempool" delayed shutdown method.
    # Type: object
    mempool:
      # Sets the number of seconds to poll for `MEMPOOL.sess` stats. Only applicable when
      # `server.delayedShutdown.method` is set to "mempool".
      #
      # This value requires tuning to traffic patterns. If the time between each traffic
      # took more than `server.delayedShutdown.mempool.pollSeconds`, then Varnish Cache
      # could be signaled to SIGHUP too early, leading to an HTTP 502 error on the load
      # balancer (as Varnish Cache already stopped accepting connection).
      # Type: number or string
      # Availability: v1.1.0
      pollSeconds: 1

      # Sets the number of seconds to wait after `MEMPOOL.sess` turned zero. Only
      # applicable when `server.delayedShutdown.method` is set to "mempool".
      # Type: number or string
      # Availability: v1.1.0
      waitSeconds: 5

  # Sets the image and tag to use to deploy Varnish Cache.
  # Type: object
  image:
    # Sets the repository for Varnish Cache image.
    # Type: string
    repository: "docker.io/varnish"

