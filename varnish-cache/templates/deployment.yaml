{{- if eq .Values.server.kind "Deployment" }}
{{- if .Values.server.updateStrategy }}
{{- fail "'server.updateStrategy' cannot be enabled when 'server.kind' is 'Deployment'" }}
{{- end }}
{{- if not (empty .Values.server.extraVolumeClaimTemplates) }}
{{- fail "'server.extraVolumeClaimTemplates' cannot be enabled when 'server.kind' is 'Deployment'" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "varnish-common.fullname" . }}
  {{- include "varnish-common.serverLabels" . | nindent 2 }}
  {{- include "varnish-common.serverAnnotations" . | nindent 2 }}
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicas }}
  {{- end }}
  {{- include "varnish-common.strategy" . | indent 2 }}
  selector:
    matchLabels:
      {{- include "varnish-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "varnish-common.podLabels" . | nindent 6 }}
      {{- include "varnish-common.podAnnotations" . | nindent 6 }}
    spec:
      {{- include "varnish-common.podImagePullSecrets" . | indent 6 }}
      {{- include "varnish-common.podServiceAccount" . | indent 6 }}
      {{- include "varnish-common.podSecurityContext" . | indent 6 }}
      shareProcessNamespace: {{ .Values.server.shareProcessNamespace | toJson }}
      containers:
        {{- include "varnish-common.serverContainer" . | indent 8 }}
        {{- include "varnish-common.ncsaContainer" . | indent 8 }}
        {{- include "varnish-common.extraContainers" . | indent 8 }}
      {{- if .Values.server.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- include "varnish-common.initContainers" . | indent 6 }}
      {{- include "varnish-common.podVolumes" . | indent 6 }}
      {{- include "varnish-common.nodeSelector" . | indent 6 }}
      {{- include "varnish-common.affinity" . | indent 6 }}
      {{- include "varnish-common.tolerations" . | indent 6 }}
      {{- include "varnish-common.terminationGracePeriodSeconds" . | indent 6 }}
{{- end }}
