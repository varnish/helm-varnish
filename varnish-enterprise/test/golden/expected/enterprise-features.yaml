# Source: varnish-enterprise/templates/configmap-vcl.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-varnish-enterprise-vcl-wrapped-default-vcl
  labels:
    helm.sh/chart: varnish-enterprise-CHART_VERSION
    app.kubernetes.io/name: varnish-enterprise
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "APP_VERSION"
    app.kubernetes.io/managed-by: Helm
data:
  wrapped-default.vcl: |
    vcl 4.1;
    import activedns;
    include "cluster.vcl";
    sub vcl_init {
      # Turn on trace headers for debug (optional)
      # For dynamic cluster, create a DNS group with the domain name for headless service
      new cluster_group = activedns.dns_group(
        "golden-varnish-enterprise-peers:6081"
      );
      # Subscribe the cluster director to the DNS group
      cluster.subscribe(cluster_group.get_tag());
      # Set the cluster token
      cluster_opts.set("token", std.getenv("VARNISH_CLUSTER_TOKEN") );
    }
    include "/etc/varnish/default.vcl";
