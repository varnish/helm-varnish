    # [imagePullPolicy](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
    # for the Varnish Cache image. This can be one of Always, Never, or IfNotPresent.
    # Type: string
    pullPolicy: "IfNotPresent"

    # Sets the tag for the Varnish Cache image. By default, this is set to the same
    # application version as in the Varnish Cache Helm Chart. If the tag is set to
    # non-exact versions (such as "latest"), make sure to set `server.image.pullPolicy` to
    # "Always" to make sure the image is always updated.
    # Type: string or number
    tag: ""

