# Source: varnish-enterprise/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-varnish-enterprise
  labels:
    app.kubernetes.io/instance: golden
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: varnish-enterprise
    app.kubernetes.io/version: APP_VERSION
    helm.sh/chart: varnish-enterprise-CHART_VERSION
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: varnish-enterprise
      app.kubernetes.io/instance: golden
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: golden
        app.kubernetes.io/name: varnish-enterprise
      annotations:
        checksum/golden-vcl-bundle: 958ea3ea183690657909e49fc49e444649ccae01597849433e4d25c51365ee07
    spec:
      serviceAccountName: golden-varnish-enterprise
      securityContext:
        fsGroup: 999
      shareProcessNamespace: false
      containers:
        - name: varnish-enterprise
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "quay.io/varnish-software/varnish-plus:APP_VERSION"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6081
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 6081
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 6081
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          env:
            - name: VARNISH_WORKDIR
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - /usr/sbin/varnishd
            - -F
            - -T
            - 127.0.0.1:6082
            - -I
            - /etc/varnish/vcls/cmds.cli
            - -f
            - ""
            - -p
            - thread_pool_max=1000
            - -p
            - thread_pool_min=50
            - -p
            - thread_pool_timeout=120
            - -n
            - $(VARNISH_WORKDIR)
            - -t
            - "120"
            - -a
            - http=0.0.0.0:6081
            - -s
            - mse
          volumeMounts:
            - name: golden-varnish-vsm
              mountPath: /var/lib/varnish
            - name: golden-config-shared
              mountPath: /etc/varnish/shared
            - name: golden-config-vcl-bundle-router
              mountPath: /etc/varnish/vcls/router.vcl
              subPath: router.vcl
            - name: golden-config-vcl-bundle-cmds
              mountPath: /etc/varnish/vcls/cmds.cli
              subPath: cmds.cli
            - name: golden-config-vcl-bundle-foo
              mountPath: /etc/varnish/vcls/foo.vcl
              subPath: foo.vcl
            - name: golden-config-vcl-bundle-any
              mountPath: /etc/varnish/vcls/any.vcl
              subPath: any.vcl
            - name: golden-config-vcl-bundle-include-helpers-vcl
              mountPath: /etc/varnish/vcls/helpers.vcl
              subPath: helpers.vcl
        - name: varnish-enterprise-ncsa
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "quay.io/varnish-software/varnish-plus:APP_VERSION"
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/varnishncsa"]
          args:
            - -n
            - $(VARNISH_WORKDIR)
            - -c
          env:
            - name: VSM_NOPID
              value: "1"
            - name: VARNISH_WORKDIR
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "/usr/bin/varnishncsa -d -t3 -n \"$VARNISH_WORKDIR\""
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "/usr/bin/varnishncsa -d -t3 -n \"$VARNISH_WORKDIR\""
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          volumeMounts:
            - name: golden-varnish-vsm
              mountPath: /var/lib/varnish
            - name: golden-config-shared
              mountPath: /etc/varnish/shared
      volumes:
      - name: golden-varnish-vsm
        emptyDir:
          medium: "Memory"
      - name: golden-config-shared
        emptyDir:
          medium: "Memory"
      - name: golden-config-vcl-bundle-router
        configMap:
          name: golden-varnish-enterprise-vcl-bundle-router
      - name: golden-config-vcl-bundle-cmds
        configMap:
          name: golden-varnish-enterprise-vcl-bundle-cmds
      - name: golden-config-vcl-bundle-foo
        configMap:
          name: golden-varnish-enterprise-vcl-bundle-foo
      - name: golden-config-vcl-bundle-any
        configMap:
          name: golden-varnish-enterprise-vcl-bundle-any
      - name: golden-config-vcl-bundle-include-helpers-vcl
        configMap:
          name: golden-varnish-enterprise-vcl-bundle-include-helpers-vcl
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: varnish-enterprise
                  app.kubernetes.io/instance: golden
              topologyKey: kubernetes.io/hostname
