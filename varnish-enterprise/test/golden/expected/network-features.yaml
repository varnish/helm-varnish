---
# Source: varnish-enterprise/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-varnish-enterprise
  labels:
    app.kubernetes.io/instance: golden
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: varnish-enterprise
    app.kubernetes.io/version: APP_VERSION
    helm.sh/chart: varnish-enterprise-CHART_VERSION
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: varnish-enterprise
      app.kubernetes.io/instance: golden
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: golden
        app.kubernetes.io/name: varnish-enterprise
    spec:
      serviceAccountName: golden-varnish-enterprise
      securityContext:
        fsGroup: 999
      shareProcessNamespace: false
      containers:
        - name: varnish-enterprise
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "quay.io/varnish-software/varnish-plus:APP_VERSION"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6081
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 6081
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 6081
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          env:
          command:
            - /usr/sbin/varnishd
            - -F
            - -T
            - 127.0.0.1:6082
            - -f
            - /etc/varnish/default.vcl
            - -p
            - thread_pool_min=50
            - -p
            - thread_pool_max=1000
            - -a
            - http=0.0.0.0:6081
            - -S
            - /etc/varnish/shared/secret
          volumeMounts:
            - name: golden-varnish-vsm
              mountPath: /var/lib/varnish
            - name: golden-config-shared
              mountPath: /etc/varnish/shared
        - name: varnish-enterprise-ncsa
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "quay.io/varnish-software/varnish-plus:APP_VERSION"
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/varnishncsa"]
          env:
            - name: VSM_NOPID
              value: "1"
          volumeMounts:
            - name: golden-varnish-vsm
              mountPath: /var/lib/varnish
            - name: golden-config-shared
              mountPath: /etc/varnish/shared
      initContainers:
        - name: varnish-enterprise-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "quay.io/varnish-software/varnish-plus:APP_VERSION"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - umask 077; test -s /etc/varnish/shared/secret || head -c 32 /dev/urandom > /etc/varnish/shared/secret
          volumeMounts:
            - name: golden-config-shared
              mountPath: /etc/varnish/shared
      volumes:
      - name: golden-varnish-vsm
        emptyDir:
          medium: "Memory"
      - name: golden-config-shared
        emptyDir:
          medium: "Memory"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: varnish-enterprise
                  app.kubernetes.io/instance: golden
              topologyKey: kubernetes.io/hostname
