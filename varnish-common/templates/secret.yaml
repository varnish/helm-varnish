{{- if and (include "varnish-common.clusterEnabled" .) (not .Values.cluster.secretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "varnish-common.fullname" . }}-cluster-secret
  labels:
    {{- include "varnish-common.labels" . | nindent 4 }}
data:
  token: "{{ randAlphaNum 20 | b64enc }}"
{{- end }}
