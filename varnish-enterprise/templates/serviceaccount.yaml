{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "varnish.serviceAccountName" . }}
  labels:
    {{- include "varnish.labels" . | nindent 4 }}
    {{- include "varnish.serviceAccountLabels" . | indent 4 }}
  {{- include "varnish.serviceAccountAnnotations" . | indent 2 }}
{{- end }}
