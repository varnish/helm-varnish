    app.kubernetes.io/version: "APP_VERSION"
    app.kubernetes.io/managed-by: Helm
data:
  any.vcl: |
    vcl 4.1;
    backend default none;
    sub vcl_recv { return (synth(404)); }
---
# Source: varnish-cache/templates/configmap-vcl.yaml
apiVersion: v1
kind: ConfigMap
metadata:
