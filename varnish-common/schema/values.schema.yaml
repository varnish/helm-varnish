          externalTrafficPolicy:
            type: string
            enum: ["", Cluster, Local]
            x-type-label: string
            default: Cluster
            description: |
              Sets the external traffic policy for this service. externalTrafficPolicy describes how nodes distribute service traffic they receive on one of the Service's "externally-facing" addresses (NodePorts, ExternalIPs, and LoadBalancer IPs). Can be set to `Local` or `Cluster`. Only rendered when `server.service.type` is NodePort or LoadBalancer, the only types Kubernetes accepts it for.

      ingress:
        type: object
        additionalProperties: false
        description: |
          An object for configuring [Ingress][k8s-ingress].
        properties:
          enabled:
            type: boolean
            default: false
            description: |
              Enables the [Ingress][k8s-ingress] for {product}. Requires `server.http.enabled`; the Ingress targets the Service's `http` port (`server.service.http.port`).

          labels:
            $ref: "#/definitions/objectOrTemplate"
            default: {}
            description: |
              Applies extra labels to the Ingress. The value can be set as either an object or a template string.

          annotations:
            $ref: "#/definitions/objectOrTemplate"
            default: {}
            description: |
              Applies extra annotations to the Ingress. The value can be set as either an object or a template string.

          ingressClassName:
            type: string
            default: ""
            description: |
