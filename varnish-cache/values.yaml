  otel:
    # Runs `/usr/bin/varnish-otel` in a sidecar container to export Varnish logs and
    # metrics to an OTLP (OpenTelemetry Protocol) endpoint. `varnish-otel` is included in
    # the official `varnish` image since 9.0.3.
    # Type: boolean
    enabled: false

    # Sets the image and tag to use to deploy the Varnish OTEL sidecar. Setting a field to
    # "-" inherits it from `server.image`.
    # Type: object
    image:
      # Sets the image repository of the OTEL sidecar. The image must be the same Varnish
      # version as the server. When set to "-", `server.image.repository` is used.
      repository: "-"

      # Sets the
      # [imagePullPolicy](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
      # of the OTEL sidecar. When set to "-", `server.image.pullPolicy` is used.
      pullPolicy: "-"

      # Sets the image tag of the OTEL sidecar. When set to "-", `server.image.tag` is
      # used.
      tag: "-"

    # An object that conforms to the Kubernetes
    # [securityContext](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
    # definition of a Container. This securityContext will be set on the OTEL container.
    # For setting securityContext on the Pod itself, see `global.podSecurityContext`. For
    # setting securityContext to all containers, see `global.securityContext`.
    # Type: object or template string
    securityContext: {}

    # An object that conforms to the Kubernetes
    # [resources](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
    # definition of a Container. This configuration can be used to limit resources
    # consumed by the OTEL container.
    # Type: object or template string
    resources: {}

    # Sets environment variables of the OTEL container, typically to configure the
    # OpenTelemetry exporters. See also the [OpenTelemetry environment variables
    # specification](https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/).
    # Can be set as an object, an array of objects, or a template string.
    # Type: array of objects, object, or template string
    # Example:
    #   env:
    #     OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    env: null

# An array of objects to attach Kubernetes manifests to the workload.
# Type: array of objects
# Example:
#   extraManifests:
#     - name: clusterrole
#       data: |
#         apiVersion: rbac.authorization.k8s.io/v1
#         kind: ClusterRole
#         metadata:
#           name: {{ .Release.Name }}-clusterrole
#         # ...
extraManifests: []
