{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "varnish-common.serviceAccountName" . }}
  labels:
    {{- include "varnish-common.labels" . | nindent 4 }}
    {{- include "varnish-common.serviceAccountLabels" . | indent 4 }}
  {{- include "varnish-common.serviceAccountAnnotations" . | indent 2 }}
{{- end }}
