---
# Source: varnish-cache/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: golden-varnish-cache
  labels:
    helm.sh/chart: varnish-cache-CHART_VERSION
    app.kubernetes.io/name: varnish-cache
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "APP_VERSION"
    app.kubernetes.io/managed-by: Helm
---
# Source: varnish-cache/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: golden-varnish-cache
  labels:
    helm.sh/chart: varnish-cache-CHART_VERSION
    app.kubernetes.io/name: varnish-cache
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "APP_VERSION"
    app.kubernetes.io/managed-by: Helm
spec:
  type: NodePort
  internalTrafficPolicy: Cluster
  externalTrafficPolicy: Cluster
  ports:
    - name: http
      port: 80
      targetPort: 6081
  selector:
    app.kubernetes.io/name: varnish-cache
    app.kubernetes.io/instance: golden
---
# Source: varnish-cache/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: golden-varnish-cache
  labels:
    app.kubernetes.io/instance: golden
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: varnish-cache
    app.kubernetes.io/version: APP_VERSION
    helm.sh/chart: varnish-cache-CHART_VERSION
spec:
  serviceName: golden-varnish-cache
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: varnish-cache
      app.kubernetes.io/instance: golden
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: golden
        app.kubernetes.io/name: varnish-cache
    spec:
      serviceAccountName: golden-varnish-cache
      securityContext:
        fsGroup: 999
      shareProcessNamespace: false
      containers:
        - name: varnish-cache
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "docker.io/varnish:APP_VERSION"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6081
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 6081
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 6081
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          command:
            - /usr/sbin/varnishd
            - -F
            - -a
            - http=$(VARNISH_HTTP_ADDRESS):6081,HTTP
            - -f
            - /etc/varnish/default.vcl
            - -T
            - 127.0.0.1:6082
            - -t
            - "120"
            - -p
            - thread_pool_min=50
            - -p
            - thread_pool_max=1000
            - -p
            - thread_pool_timeout=120
          env:
            - name: VARNISH_HTTP_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: golden-varnish-vsm
              mountPath: /var/lib/varnish
        - name: varnish-cache-ncsa
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "docker.io/varnish:APP_VERSION"
          imagePullPolicy: IfNotPresent
          command: ["varnishncsa"]
          args:
            - -c
          readinessProbe:
            exec:
              command:
                - /usr/bin/varnishncsa
                - -d
                - -t 3
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            exec:
              command:
                - /usr/bin/varnishncsa
                - -d
                - -t 3
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          volumeMounts:
            - name: golden-varnish-vsm
              mountPath: /var/lib/varnish
      volumes:
      - name: golden-varnish-vsm
        emptyDir:
          medium: "Memory"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: varnish-cache
                  app.kubernetes.io/instance: golden
              topologyKey: kubernetes.io/hostname
