      extraVolumeClaimTemplates:
        $ref: "#/definitions/arrayOrTemplate"
        default: []
        x-since:
          enterprise: v1.3.0
        description: |
          An array of objects that conforms to the Kubernetes [VolumeClaimTemplates][k8s-volume-claim-templates] definition of a StatefulSet workload. This configuration is only available when `server.kind` is set to StatefulSet.
        x-examples:
          - description: "For example:"
            value: |
              - metadata:
                  name: {{ .Release.Name }}-pv
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: "10G"

      extraVolumeMounts:
        $ref: "#/definitions/arrayOrTemplate"
        default: []
        description: |
          An array of objects that conforms to the Kubernetes [volumeMounts][k8s-pod-v1-containers] definition of a Container. This configuration is used to mount extra volumes defined in `server.extraVolumes` into the {product} container. The value can be set as either an array of objects or a template string.
        x-examples:
          - description: "For example:"
            value: |
              - name: {{ .Release.Name }}-local-data
                mountPath: /var/lib/data

      extraVolumes:
        $ref: "#/definitions/arrayOrTemplate"
        default: []
        description: |
          An array of objects that conforms to the Kubernetes [volumes][k8s-pod-v1-pods] definition of a Pod. This configuration is used to define volumes to be used in `server.extraVolumeMounts`, or within `server.extraContainers`, or within `server.extraInitContainers`. The value can be set as either an array of objects or a template string.
        x-examples:
          - description: "For example:"
            value: |
              - name: {{ .Release.Name }}-local-data
                hostPath:
                  path: /data
                  type: Directory

      mse4:
        x-flavor: enterprise
        type: object
        additionalProperties: false
        description: |
          An object for configuring the Massive Storage Engine 4 (MSE4).
        properties:
          enabled:
            type: boolean
            default: false
            x-since:
              enterprise: v1.6.1
            description: |
              Enables Massive Storage Engine 4. When disabled, varnishd uses its default storage.

              To set the amount of memory MSE4 uses, set the `memory_target` parameter with `server.parameters.memoryTarget`, as a percentage (e.g., "80%") or in bytes ("512m"). If `server.resources` sets a memory limit, the percentage is of that limit.

          config:
            type: string
            x-type-label: template string
            default: ""
            x-since:
              enterprise: v1.6.1
            description: |
              An MSE4 configuration. By default, the value is unset and MSE4 is run in a memory-only mode.

              If `server.mse4.persistence.enabled` is true, the persistent volume is mounted at `/var/lib/mse4`; use that path for the books and stores in the configuration.

          persistence:
            type: object
            additionalProperties: false
            properties:
              enabled:
                type: boolean
                default: false
                description: |
                  Enables MSE4 persistence; only applicable if `server.kind` is `StatefulSet`. Note that the backing storage must be "ext4".

              bookSize:
                x-type-label: string or number
                anyOf:
                  - $ref: "#/definitions/sizeOrPercent"
                  - type: integer
                    minimum: 0
                default: 1%
                description: |
                  Database size relative to `server.mse4.persistence.storageSize`, for auto-configuring MSE4. Can be set as a percentage or a value.

                  `server.mse4.persistence.bookSize` and `server.mse4.persistence.storeSize` must add up to 100% or `server.mse4.persistence.storageSize`. Only applicable if `server.mse4.config` is empty.

              storeSize:
                x-type-label: string or number
                anyOf:
                  - $ref: "#/definitions/sizeOrPercent"
                  - type: integer
                    minimum: 0
                default: 91%
                description: |
                  Store size relative to `server.mse4.persistence.storageSize`, for auto-configuring MSE4. Can be set as a percentage or a value.

                  `server.mse4.persistence.bookSize` and `server.mse4.persistence.storeSize` must add up to 100% or `server.mse4.persistence.storageSize`. Only applicable if `server.mse4.config` is empty.

              labels:
                $ref: "#/definitions/objectOrTemplate"
                default: {}
                description: |
                  Sets the extra labels for the PersistentVolumeClaim for MSE4. Can be set as an object or a template string.

              annotations:
                $ref: "#/definitions/objectOrTemplate"
                default: {}
                description: |
                  Sets the extra annotations for the PersistentVolumeClaim for MSE4. Can be set as an object or a template string.

              accessModes:
                type: [array, "null"]
                items:
                  type: string
                x-type-label: array of strings
                default: [ReadWriteOnce]
                description: |
                  Sets the storage access modes for the PersistentVolumeClaim for MSE4.

              storageClassName:
                type: string
                default: ""
                description: |
                  Sets the storage class for the PersistentVolumeClaim for MSE4.

              storageSize:
                $ref: "#/definitions/sizeString"
                default: 10Gi
                description: |
                  Sets the storage size for the PersistentVolumeClaim for MSE4.

      vclConfig:
        type: string
        x-type-label: template string
        default: ""
        description: |
          The main VCL of {product}, mounted at `/etc/varnish/default.vcl`. It can load the files of `server.vcls.includes` with `include "./vcls/<file>";`. It must not be set together with `server.vcls.routes`.
        x-examples:
          - description: "For example:"
            value: |
              vcl 4.1;

              backend default {
                .host = "www.example.com";
                .port = "80";
              }

              sub vcl_backend_fetch {
                set bereq.http.Host = "www.example.com";
              }

      vcls:
        type: object
        additionalProperties: false
        x-since:
          enterprise: v1.8.0
        description: |
          Per-domain VCL routing (multi-tenant) and shared VCL files. When `server.vcls.routes` is set, the chart generates a routing VCL and a cmdfile from these settings, superseding `server.vclConfig`. `server.vcls.includes` works with or without routes.
        properties:
          routes:
            type: [array, "null"]
            x-type-label: array of objects
            default: []
            description: |
              Per-domain VCL routing. When set, the chart generates a routing VCL and a cmdfile that load each route as a separate VCL and select it based on the Host header, superseding `server.vclConfig` (which must not be set). Each route must set `vclContent`, and can set `name` (defaults to the first hostname, prefixed with `route_` if it does not start with a letter) and `hostnames`. As it is used as a VCL label, `name` must start with a letter. A route without hostnames is a catch-all and must be the last one.
            x-examples:
              - description: "For example:"
                value:
                  - name: foo-site
                    hostnames:
                      - foo.com
                      - www.foo.com
                    vclContent: |
                      vcl 4.1;
                      backend default { .host = "foo-backend"; }
                  - vclContent: |
                      vcl 4.1;
                      backend default none;
                      sub vcl_recv { return (synth(404)); }
            items:
              type: object
              additionalProperties: false
              required: [vclContent]
              properties:
                name:
                  type: [string, "null"]
                  description: |
                    The name of the route, used as a VCL label, so it must start with a letter. Defaults to the first hostname, prefixed with `route_` if it does not start with a letter, or to `any` for a route without hostnames.
                hostnames:
                  type: [array, "null"]
                  x-type-label: array of strings
                  items:
                    type: string
                  description: |
                    The hostnames to match for this route. A route without hostnames is a catch-all and must be the last one.
                vclContent:
                  type: string
                  x-type-label: template string
                  description: |
                    The VCL of the route. Required.

          includes:
            type: object
            x-type-label: object of template strings
            propertyNames:
              pattern: "^[-._a-zA-Z0-9/]+$"
            additionalProperties:
              type: string
            default: {}
            description: |
              Extra VCL files placed in `/etc/varnish/vcls/`, next to the route VCLs if any. Each key is a filename (subdirectories allowed) and each value a template string. Load them with a path relative to the including file: `include "./vcls/<file>";` from `server.vclConfig`, and `include "./<file>";` from a route VCL. Plain filenames are looked up in `vcl_path` instead.
            x-examples:
              - description: "For example, `server.vclConfig` can use the following with `include \"./vcls/helpers.vcl\";` and `call common_recv;` (a route VCL would use `include \"./helpers.vcl\";`):"
                value:
                  helpers.vcl: |
                    sub common_recv {
                    }

      baseUrl:
        x-flavor: enterprise
        type: string
        default: ""
        x-since:
          enterprise: v1.4.0
        description: |
          Sets a base URL for Varnish Controller and Varnish Controller Router when performing a HTTP-based routing. If unset, the URL will infer from a Pod IP and `server.http.port`.

      terminationGracePeriodSeconds:
        type: [integer, "null"]
        minimum: 0
        x-type-label: number
        default: null
        x-since:
          enterprise: v1.6.0
        description: |
          Sets the termination grace period seconds to wait for {product} to shut down. Once this number of seconds is reached without the {product} Pod shutting down, Kubernetes will send SIGKILL to the Pod. When unset, the Kubernetes default (30 seconds) applies; `0` is rendered as is.

          When `server.delayedShutdown.method` is not "none", this value must be set, and rendering fails if it is shorter than the delay: `server.delayedShutdown.sleep.seconds`, `server.delayedShutdown.mempool.waitSeconds` or `server.delayedShutdown.shutdownDelay.seconds`. Set it higher than the **maximum** time (in seconds) it takes {product} to fully shut down after a delayed shutdown. With "mempool", that includes the time to drain connections.

          The value to set here depends on the cluster setup. For example, an AWS Load Balancer may still forward requests to Varnish for `deregistration_delay.timeout_seconds` which is set to 300 seconds by default. If `server.delayedShutdown` took 30 seconds, then `server.terminationGracePeriodSeconds` should be set to _at least_ 330 seconds in order to have a zero-downtime during a rolling update or scaling down.

      delayedShutdown:
        type: object
        additionalProperties: false
        description: |
          Configures delayed shutdown for zero-downtime downscaling.
        properties:
          method:
            type: string
            enum: [none, sleep, mempool, shutdown_delay]
            x-enum-flavor:
              shutdown_delay: enterprise
            default: none
            x-since:
              cache: v1.1.0
              enterprise: v1.6.0
            description: |
              Sets the method for delaying the shutdown of {product}. This is useful for rolling updates or when scaling down, where the load balancer component may still attempt to forward requests to the {product} instance when {product} has already received a SIGHUP, leading to HTTP 502 errors.

              Multiple methods are provided here:

              - `sleep` will simply sleep in the `preStop` for `server.delayedShutdown.sleep.seconds` seconds. This is the simplest way to delay the shutdown of {product} when the time taken for the load balancer component to stop forwarding traffic to {product} is largely fixed.
              - `mempool` polls varnishstat for `MEMPOOL.sess` to go down to zero. This allows for the quickest shutdown but requires tuning `server.delayedShutdown.mempool.pollSeconds` to traffic patterns (as `MEMPOOL.sess` may become 0 momentarily, resulting in an early shutdown).

              When `server.delayedShutdown.method` is set to a value other than "none", `server.terminationGracePeriodSeconds` **must** also be set, to at least the delay. Rendering fails otherwise.

          sleep:
            type: object
            additionalProperties: false
            description: |
              Configures the "sleep" delayed shutdown method.
            properties:
              seconds:
                type: [integer, number, string]
                default: 90
                x-since:
                  cache: v1.1.0
                description: |
                  Sets the number of seconds to sleep before SIGHUP is sent to {product}. Only applicable when `server.delayedShutdown.method` is set to "sleep".

          mempool:
            type: object
            additionalProperties: false
            description: |
              Configures the "mempool" delayed shutdown method.
            properties:
              pollSeconds:
                type: [integer, number, string]
                default: 1
                x-since:
                  cache: v1.1.0
                description: |
                  Sets the number of seconds to poll for `MEMPOOL.sess` stats. Only applicable when `server.delayedShutdown.method` is set to "mempool".

                  This value requires tuning to traffic patterns. If the time between each traffic took more than `server.delayedShutdown.mempool.pollSeconds`, then {product} could be signaled to SIGHUP too early, leading to an HTTP 502 error on the load balancer (as {product} already stopped accepting connection).

              waitSeconds:
                type: [integer, number, string]
                default: 5
                x-since:
                  cache: v1.1.0
                description: |
                  Sets the number of seconds to wait after `MEMPOOL.sess` turned zero. Only applicable when `server.delayedShutdown.method` is set to "mempool".

          shutdownDelay:
            x-flavor: enterprise
            type: object
            additionalProperties: false
            description: |
              Configures the "shutdown_delay" delayed shutdown method. It is similar to `sleep`, but uses the `shutdown_delay` feature of {product} (6.0.13r2 and newer) to perform the wait in-engine instead of relying on `preStop` and an external command.
            properties:
              seconds:
                type: [integer, number, string]
                default: 90
                description: |
                  Sets the number of seconds to delay the shutdown in-engine. Only applicable when `server.delayedShutdown.method` is set to "shutdown_delay".

      image:
        allOf:
          - $ref: "#/definitions/image"
        description: |
          Sets the image and tag to use to deploy {product}.
        properties:
          repository:
            type: string
            x-default:
              cache: docker.io/varnish
              enterprise: quay.io/varnish-software/varnish-plus
            description: |
              Sets the repository for {product} image.

          pullPolicy:
            $ref: "#/definitions/pullPolicy"
            default: IfNotPresent
            description: |
              Sets the [imagePullPolicy][k8s-pod-v1-containers] for the {product} image. This can be one of Always, Never, or IfNotPresent.

          tag:
            type: string
            default: ""
            x-default-text: _same as appVersion_
            description: |
              Sets the tag for the {product} image. By default, this is set to the same application version as in the {product} Helm Chart. If the tag is set to non-exact versions (such as "latest"), make sure to set `server.image.pullPolicy` to "Always" to make sure the image is always updated.

      autoscaling:
        type: object
        additionalProperties: false
        description: |
          An object for configuring [HorizontalPodAutoscaling][k8s-hpa].
        properties:
          enabled:
            type: boolean
            default: false
            description: |
              Enables the [HorizontalPodAutoscaling][k8s-hpa] with the {product} Pod. `server.replicas` is ignored if autoscaling is enabled. Rendering fails when `server.kind` is `DaemonSet`, which has no replicas to scale.

          minReplicas:
            $ref: "#/definitions/intOrDash"
            default: "-"
            description: |
              Sets the minimum number of replicas to always keep running. When set to "-", the value of `server.replicas` is used.

          maxReplicas:
            type: integer
            x-type-label: number
            default: 100
            description: |
              Sets the maximum number of replicas to run at most.

          behavior:
            $ref: "#/definitions/objectOrTemplate"
            default: ""
            x-since:
              cache: v1.1.0
              enterprise: v1.6.0
            description: |
              Sets the [HorizontalPodAutoscaling][k8s-hpa] behavior. The value can be set as either an object or a template string.
            x-examples:
              - description: "For example:"
                value:
                  scaleDown:
                    stabilizationWindowSeconds: 120
                    policies:
                      - type: Percent
                        value: 50
                        periodSeconds: 60
                  scaleUp:
                    policies:
                      - type: Percent
                        value: 100
                        periodSeconds: 60
                      - type: Pods
                        value: 4
                        periodSeconds: 60
                    selectPolicy: Max

          metrics:
            $ref: "#/definitions/arrayOrTemplate"
            default: ""
            description: |
              Sets the [HorizontalPodAutoscaling][k8s-hpa] metrics. The value can be set as either an array or a template string.
            x-examples:
              - description: "For example:"
                value: |
                  - type: Resource
                    resource:
                      name: cpu
                      target:
                        type: Utilization
                        averageUtilization: 80

      pdb:
        type: object
        additionalProperties: false
        description: |
          An object for configuring [PodDisruptionBudget][k8s-pdb]. See also [Specifying a Disruption Budget for your Application](https://kubernetes.io/docs/tasks/run-application/configure-pdb/).
        properties:
          enabled:
            type: boolean
            default: false
            x-since:
              enterprise: v1.2.0
            description: |
              Enables PodDisruptionBudget.

          minAvailable:
            x-type-label: string or number
            anyOf:
              - type: integer
              - type: string
                pattern: "^([0-9]+%?)?$"
            default: ""
            x-since:
              enterprise: v1.2.0
            description: |
              Sets the number or percentage of pods that must be available after the eviction. Required if `server.pdb.enabled` is true and `server.pdb.maxUnavailable` is not set.

          maxUnavailable:
            x-type-label: string or number
            anyOf:
              - type: integer
              - type: string
                pattern: "^([0-9]+%?)?$"
            default: ""
            x-since:
              enterprise: v1.2.0
            description: |
              Sets the number or percentage of pods that can be unavailable after the eviction. Required if `server.pdb.enabled` is true and `server.pdb.minAvailable` is not set.

      service:
        type: object
        additionalProperties: false
        description: |
          An object for configuring [Service][k8s-service].
        properties:
          enabled:
            type: boolean
            default: true
            description: |
              Enables the [Service][k8s-service] for {product}.

          labels:
            $ref: "#/definitions/objectOrTemplate"
            default: {}
            description: |
              Applies extra labels to the Service. The value can be set as either an object or a template string.

          annotations:
            $ref: "#/definitions/objectOrTemplate"
            default: {}
            description: |
              Applies extra annotations to the Service. The value can be set as either an object or a template string.

          type:
            type: string
            default: NodePort
            description: |
              Sets the type of the Service. Can be either `ClusterIP`, `LoadBalancer`, or `NodePort`.

              See also [Accessing Varnish Enterprise in Kubernetes Cluster](https://docs.varnish-software.com/varnish-helm/guides/accessing-varnish-enterprise/).

          clusterIP:
            type: string
            default: ""
            description: |
              Sets a custom [Service ClusterIP][k8s-service-clusterip]. This value can be set as either an IP address, or a literal string "None". Only applicable when `server.service.type` is set to ClusterIP. When set to "None", Kubernetes will create a Headless Service, skipping the Kubernetes proxying mechanism. In such case, `server.service.http.port` and `server.service.https.port` are ignored, and `server.http.port` and `server.tls.port` are used instead.

              See also [Accessing Varnish Enterprise in Kubernetes Cluster](https://docs.varnish-software.com/varnish-helm/guides/accessing-varnish-enterprise/).

          loadBalancerIP:
            type: string
            default: ""
            x-since:
              enterprise: v1.4.0
            description: |
              Sets a pre-allocated IP address for use in LoadBalancer.

          http:
            type: object
            additionalProperties: false
            description: |
              Configures the `http` port of the Service. The port is exposed if and only if `server.http.enabled` is true.
            properties:
              port:
                $ref: "#/definitions/port"
                default: 80
                description: |
                  Sets the port to expose HTTP service.

              nodePort:
                x-type-label: number
                anyOf:
                  - $ref: "#/definitions/port"
                  - type: "null"
                x-values-example: 30080
                description: |
                  Sets the port to expose HTTP service directly on the node itself. Only applicable when `server.service.type` is set to NodePort. This value must be within the Kubernetes service-node-port-range (default: 30000-32767).

                  See also [Accessing Varnish Enterprise in Kubernetes Cluster](https://docs.varnish-software.com/varnish-helm/guides/accessing-varnish-enterprise/).

          https:
            type: object
            additionalProperties: false
            description: |
              Configures the `https` port of the Service. The port is exposed if and only if `server.tls.enabled` is true.
            properties:
              port:
                $ref: "#/definitions/port"
                default: 443
                description: |
                  Sets the port to expose HTTPS service.

              nodePort:
                x-type-label: number
                anyOf:
                  - $ref: "#/definitions/port"
                  - type: "null"
                x-values-example: 30443
                description: |
                  Sets the port to expose HTTPS service directly on the node itself. Only applicable when `server.service.type` is set to NodePort. This value must be within the Kubernetes service-node-port-range (default: 30000-32767).

                  See also [accessing Varnish via NodePort](https://docs.varnish-software.com/varnish-helm/guides/accessing-varnish-enterprise/#nodeport).

          extraServices:
            type: array
            default: []
            description: |
              An array of extra services to expose via the Service. Each extra service adds a port named `extra-<name>` to the Service.
            x-examples:
              - description: "For example:"
                value:
                  - name: proxy
                    targetPort: 8088
                    port: 8088
                    nodePort: 30888
            items:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  description: |
                    Sets the name of the extra service. Required.
                targetPort:
                  $ref: "#/definitions/portOrName"
                  description: |
                    Sets the port in the Pod to forward requests to, as a number or as a port name such as `extra-<name>` for `server.extraListens`. It must also be defined in `server.extraListens`. Required.
                port:
                  $ref: "#/definitions/port"
                  description: |
                    Sets the port to expose this extra service. Required unless the Service is headless (`server.service.clusterIP` set to "None"), in which case `targetPort` is used instead.
                nodePort:
                  x-type-label: number
                  anyOf:
                    - $ref: "#/definitions/port"
                    - type: "null"
                  description: |
                    Sets the port to expose this extra service on the node itself. Only applicable when `server.service.type` is set to NodePort. This value must be within the Kubernetes service-node-port-range (default: 30000-32767).

          internalTrafficPolicy:
            type: string
            enum: ["", Cluster, Local]
            x-type-label: string
            default: ""
            x-since:
              enterprise: v1.9.0
            description: |
