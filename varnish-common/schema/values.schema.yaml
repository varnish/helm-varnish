# The values of the varnish-cache and varnish-enterprise charts: a draft-07 JSON
# Schema with x- keywords. generate.py turns it into each chart's
# values.schema.json, values.yaml and values docs. See README.md next to this file.
$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
description: |-
  Values are validated against values.schema.json when you run helm install,
  upgrade, template or lint. Unknown keys and values of the wrong type are
  rejected, and the error names the offending path, for example
  `at '/server': additional properties 'foo' not allowed`. Pass
  `--skip-schema-validation` (Helm 3.16 or newer) to skip this check; the
  checks done by the chart templates still apply. With older Helm versions,
  fix the values instead.

x-links:
  k8s-daemonset-updatestrategy: https://kubernetes.io/docs/tasks/manage-daemon/update-daemon-set/
  k8s-deployment-strategy: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  k8s-hpa: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
  k8s-ingress: https://kubernetes.io/docs/concepts/services-networking/ingress/
  k8s-ingress-class: https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class
  k8s-ingress-path-type: https://kubernetes.io/docs/concepts/services-networking/ingress/#path-types
  k8s-ingress-tls: https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
  k8s-networkpolicy: https://kubernetes.io/docs/concepts/services-networking/network-policies/
  k8s-networkpolicy-v1: https://kubernetes.io/docs/reference/kubernetes-api/policy-resources/network-policy-v1/#NetworkPolicySpec
  k8s-pdb: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
  k8s-pod-v1-containers: https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers
  k8s-pod-v1-pods: https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#PodSpec
  k8s-probes: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  k8s-service: https://kubernetes.io/docs/concepts/services-networking/service/
  k8s-service-clusterip: https://kubernetes.io/docs/concepts/services-networking/service/#type-clusterip
  k8s-statefulset-updatestrategy: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#update-strategies
  k8s-volume-claim-templates: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#volume-claim-templates
  varnishd:
    cache: https://www.varnish.org/docs/reference/varnishd/
    enterprise: https://varnish-cache.org/docs/6.0/reference/varnishd.html
  varnishncsa:
    cache: https://www.varnish.org/docs/reference/varnishncsa/
    enterprise: https://varnish-cache.org/docs/6.0/reference/varnishncsa.html

definitions:
  objectOrTemplate:
    x-type-label: object or template string
    type: [object, string, "null"]
  arrayOrTemplate:
    x-type-label: array or template string
    type: [array, string, "null"]
    items:
      type: object
  env:
    x-type-label: array of objects, object, or template string
    type: [object, array, string, "null"]
    items:
      type: object
  k8sObject:
    x-type-label: object
    type: [object, "null"]
  extraArgs:
    x-type-label: string or array of strings
    type: [array, string, "null"]
    items:
      type: [string, number, boolean]
  port:
    x-type-label: number
    anyOf:
      - type: integer
        minimum: 0
        maximum: 65535
      - type: string
        pattern: "^([0-9]{1,4}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  portOrName:
    x-type-label: number or string
    anyOf:
      - $ref: "#/definitions/port"
      # a name needs a letter: all-digit strings are port numbers, and must
      # stay within the port range above
      - type: string
        maxLength: 15
        allOf:
          - pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
          - pattern: "[a-z]"
  nonNegInt:
    x-type-label: number
    anyOf:
      - type: integer
        minimum: 0
      - type: string
        pattern: "^[0-9]+$"
  intOrDash:
    x-type-label: number or "-"
    anyOf:
      - type: integer
      - const: "-"
  boolOrDash:
    x-type-label: boolean or "-"
    anyOf:
      - type: boolean
      - const: "-"
  probe:
    x-type-label: object
    anyOf:
      - type: [object, "null"]
      - const: ""
  toggleableProbe:
    x-type-label: object or false
    anyOf:
      - $ref: "#/definitions/probe"
      - const: false
  sizeString:
    x-type-label: string
    type: string
    pattern: "^([0-9]+(K|Ki|M|Mi|G|Gi|T|Ti|P|Pi)?)?$"
  k8sQuantity:
    x-type-label: string
    type: string
    pattern: "^((\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?)?$"
  sizeOrPercent:
    x-type-label: string
    type: string
    pattern: "^([0-9]+(K|Ki|M|Mi|G|Gi|T|Ti|P|Pi|%)?)?$"
  pullPolicy:
    x-type-label: string
    enum: [Always, IfNotPresent, Never, ""]
  image:
    x-type-label: object
    type: object
    additionalProperties: false
    properties:
      repository:
        type: string
      tag:
        type: string
      pullPolicy:
        $ref: "#/definitions/pullPolicy"

properties:
  nameOverride:
    x-docs-section: Chart configurations
    type: string
    default: ""
    x-default-text: name of the chart
    description: |
      Overrides the name of the chart (without the release name). For example, setting `nameOverride` to "hello" would produce a workload named "release-name-hello". Container names are not affected: they are always based on the chart name (`varnish-cache` or `varnish-enterprise`).

      By default, the name of the chart is used.

  fullnameOverride:
    type: string
    default: ""
    x-default-text: composition of a release name and name of the chart
    description: |
      Overrides the full name of the chart (with the release name). This setting allows overriding both the release name and the workload name altogether. For example, setting `fullnameOverride` to "hello" would produce a workload named "hello".

  global:
    x-docs-section: Global configurations
    type: object
    properties:
      imagePullSecrets:
        type: [array, "null"]
        x-type-label: array of objects
        items:
          type: object
          properties:
            name:
              type: string
        default: []
        description: |
          An array of objects that conforms to the Kubernetes [imagePullSecrets][k8s-pod-v1-containers] definition. When set, each item in an array must consist of an object with a key `name` referencing the Kubernetes secret.
        x-examples:
          - description: "For example:"
            value:
              - name: registry-quay-k7c2f4m2d5

      podSecurityContext:
        $ref: "#/definitions/k8sObject"
        x-default:
          cache:
            fsGroup: 1000
          enterprise:
            fsGroup: 999
        x-default-comments:
          fsGroup: The fsGroup to use for the pod security context.
        description: |
          An object that conforms to the Kubernetes [securityContext][k8s-pod-v1-pods] definition of a Pod.

          This securityContext will be set on all Pods within this chart. For setting securityContext on every container the chart creates, see `global.securityContext`.
        x-examples:
          - description: "For example:"
            value:
              fsGroup: 1000

      securityContext:
        $ref: "#/definitions/objectOrTemplate"
        x-default:
          cache:
            runAsUser: 1000
            runAsNonRoot: true
          enterprise:
            runAsUser: 999
            runAsNonRoot: true
        x-default-comments:
          runAsUser: >-
            The user ID to run the container as. varnish-otel fails to start with a user
            that does not exist in the image.
          runAsNonRoot: Whether to run the container as a non-root user.
        description: |
          An object that conforms to the Kubernetes [securityContext][k8s-pod-v1-containers] definition of a Container.

          This securityContext is set on every container the chart creates, merged with the container's own securityContext (e.g., `server.securityContext`), which takes precedence. The chart's init containers get the same securityContext as the {product} container. Containers from `server.extraContainers` and `server.extraInitContainers` don't get it. For setting securityContext on the Pod itself, see `global.podSecurityContext`.
        x-examples:
          - description: "For example:"
            value:
              runAsUser: 1000
              runAsNonRoot: true

      annotations:
        $ref: "#/definitions/objectOrTemplate"
        default: {}
        x-since:
          enterprise: v1.5.0
        description: |
          Applies extra annotations to the {product} workload (the Deployment, StatefulSet or DaemonSet). The value can be set as either an object or a template string.

          To apply annotations on the Pods, use `global.podAnnotations`.

      podAnnotations:
        $ref: "#/definitions/objectOrTemplate"
        default: {}
        x-since:
          enterprise: v1.5.0
        description: |
          Applies extra annotations to the {product} Pods. The value can be set as either an object or a template string.

          To apply annotations on the workload, use `global.annotations`.
        x-examples:
          - description: "For example:"
            value:
              prometheus.io/scrape: "true"
              prometheus.io/path: "/metrics"
              prometheus.io/port: "9273"
              prometheus.io/scheme: "http"

      labels:
        $ref: "#/definitions/objectOrTemplate"
        default: {}
        x-since:
          enterprise: v1.5.0
        description: |
          Applies extra labels to the {product} workload (the Deployment, StatefulSet or DaemonSet). The value can be set as either an object or a template string.

          To apply labels on the Pods, use `global.podLabels`.

      podLabels:
        $ref: "#/definitions/objectOrTemplate"
        default: {}
        x-since:
          enterprise: v1.5.0
        description: |
          Applies extra labels to the {product} Pods. The value can be set as either an object or a template string.

          To apply labels on the workload, use `global.labels`.
        x-examples:
          - description: "For example:"
            value:
              varnish-software.com/tier: "edge"

      resources:
        $ref: "#/definitions/objectOrTemplate"
        default: {}
        x-since:
          enterprise: v1.5.0
        description: |
          An object that conforms to the Kubernetes resources definition of a Container. These resources are set on every container the chart creates, merged with the container's own resources (e.g., `server.resources`, `server.varnishncsa.resources`, `server.otel.resources`), which take precedence. The chart's init containers get the same resources as the {product} container. Containers from `server.extraContainers` and `server.extraInitContainers` don't get them.
        x-examples:
          - description: "For example:"
            value:
              limits:
                cpu: 100m
                memory: 128Mi
              requests:
                cpu: 100m
                memory: 128Mi

      natsServer:
        x-flavor: enterprise
        type: object
        description: |
          An object configuring Varnish Controller Agent access to NATS.
        properties:
          externalAddress:
            type: string
            default: ""
            description: |
              An FQDN to the NATS server. The value is ignored if `global.natsServer.internal.enabled` is set to true. Required when `server.agent.enabled` is set to true and `global.natsServer.internal.enabled` is set to false.

          internal:
            type: object
            properties:
              enabled:
                $ref: "#/definitions/boolOrDash"
                default: true
                description: |
                  Configures Varnish Agent to use the internal NATS server. `"-"`, the Varnish Controller Helm Chart default for this shared global value, is treated as `true`.

              namespace:
                type: string
                default: ""
                description: |
                  Discovers the internal NATS server within the given namespace. By default, the current namespace is used. Also used to find the Varnish Controller APIGW when `server.agent.autoRemove.vcli.internal.enabled` is true.

              releaseName:
                type: string
                default: ""
                description: |
                  Overrides the full name of the internal NATS server. Required if `nameOverride` or `fullnameOverride` is used in the Varnish Controller Helm Chart. By default, "varnish-controller" is used. Also used to find the Varnish Controller APIGW when `server.agent.autoRemove.vcli.internal.enabled` is true.

              passwordFrom:
                type: object
                x-since:
                  enterprise: v1.3.0
                description: |
                  Sets internal NATS password from an external secret. Internal NATS must be configured separately. See [Varnish Controller Helm Chart documentation](https://docs.varnish-software.com/varnish-helm/varnish-controller/configurations/) for more information.

                  Note: if internal Varnish Controller is deployed on another namespace than the one Varnish Enterprise is deployed to, the `varnish-controller-credentials` secret needs to be manually copied from the Varnish Controller namespace.
                properties:
                  name:
                    type: string
                    default: varnish-controller-credentials
                    description: |
                      The name of the secret holding the internal NATS password.

                  key:
                    type: string
                    default: nats-varnish-password
                    description: |
                      The key of the secret holding the internal NATS password.

              clusterDomain:
                type: string
                default: cluster.local
                description: |
                  Overrides the Kubernetes cluster domain. Required if Kubernetes cluster is configured to use different cluster domain than the default. By default, "cluster.local" is used. In most cases, this value should not be changed.

  enabled:
    type: boolean
    x-docs-skip: true
    x-values-skip: true

  serviceAccount:
    x-docs-section: Service Account configurations
    type: object
    additionalProperties: false
    properties:
      create:
        type: boolean
        default: true
        description: |
          Create a Kubernetes service account to use with the workload.

      labels:
        $ref: "#/definitions/objectOrTemplate"
        default: {}
        description: |
          Applies extra labels to the service account. The value can be set as either an object or a template string.

      annotations:
        $ref: "#/definitions/objectOrTemplate"
        default: {}
        description: |
          Applies extra annotations to the service account. The value can be set as either an object or a template string.

      name:
        type: string
        default: ""
        description: |
          Overrides the name of the service account. By default, the full name of the chart is used when `serviceAccount.create` is `true`, and `default` otherwise.

  server:
    x-docs-section: Server configurations
    type: object
    additionalProperties: false
    required: [vcls]
    properties:
      replicas:
        $ref: "#/definitions/nonNegInt"
        default: 1
        description: |
          Specifies the number of replicas to deploy {product} server. The value is ignored if `server.kind` is "DaemonSet".

          When `server.autoscaling.enabled` is set to `true`, and `server.autoscaling.minReplicas` is `-`, the value of `server.replicas` will be used. `server.replicas` is ignored if `server.autoscaling.minReplicas` is set to a number.

      kind:
        type: string
        enum: [Deployment, DaemonSet, StatefulSet]
        default: Deployment
        description: |
          Specifies the type of workload to deploy {product} server. The value can be one of `Deployment`, `DaemonSet`, or `StatefulSet` depending on usage scenarios.

      licenseSecret:
        x-flavor: enterprise
        type: [string, "null"]
        default: null
        description: |
          Sets the secret for using a varnish-enterprise.lic file. See [Varnish Enterprise installation](https://docs.varnish-software.com/varnish-helm/varnish-enterprise/installation/).

      strategy:
        $ref: "#/definitions/objectOrTemplate"
        default: {}
        x-since:
          enterprise: v1.1.0
        description: |
          Configures [deployment strategy][k8s-deployment-strategy] to replace existing Pod with a new one. This configuration is only available when `server.kind` is set to Deployment. For StatefulSet and DaemonSet, see `server.updateStrategy`.

      updateStrategy:
        $ref: "#/definitions/objectOrTemplate"
        default: {}
        x-since:
          enterprise: v1.1.0
        description: |
          Configures update strategy for updating Pods when a change is made to the manifest. This configuration is only available when `server.kind` is set to StatefulSet or DaemonSet. For Deployment, see `server.strategy`.

          *Note: While both StatefulSet and DaemonSet share the same `updateStrategy` configuration key, its applicable values are different. See [updateStrategy on StatefulSet][k8s-statefulset-updatestrategy] and [updateStrategy on DaemonSet][k8s-daemonset-updatestrategy].*

      hostNetwork:
        type: boolean
        default: false
        description: |
          Whether to enable hostNetwork for the {product} Pod. This will make the {product} Pod bind to the port of the host instead of using a container network provided by Kubernetes.

          Setting this will also set the DNS policy to `ClusterFirstWithHostNet` to allow the Pod to communicate with Kubernetes DNS.

      shareProcessNamespace:
        type: boolean
        default: false
        x-since:
          enterprise: v1.2.1
        description: |
          Whether to enable shared PID namespace between all containers in a Pod. This is useful for a scenario where it is necessary to send a signal to a process across a container.

      http:
        type: object
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            default: true
            description: |
              Configures Varnish to listen for HTTP traffic.

          port:
            $ref: "#/definitions/port"
            default: 6081
            description: |
              Configures the TCP port on which Varnish will listen for HTTP traffic. This port is used for Varnish to bind to within a container. To change the port exposed via service to other applications, see `server.service.http.port`.

          address:
            type: string
            default: "0.0.0.0"
            x-since:
              enterprise: v1.7.4
            description: |
              Configures the address on which Varnish will listen for HTTP traffic. Ignored when `server.http.podIP` is `true`.

          podIP:
            type: boolean
            x-default:
              cache: true
              enterprise: false
            x-since:
              enterprise: v1.7.4
            description: |
              Configures Varnish to listen for HTTP traffic on the Pod IP address instead of `server.http.address`. Note that this makes port forwarding with kubectl harder.

          hostPort:
            x-type-label: number
            anyOf:
              - $ref: "#/definitions/port"
              - type: "null"
            x-values-example: 8080
            description: |
              Sets the port to expose HTTP traffic directly on the node the Pod runs on, as the container's [hostPort][k8s-pod-v1-containers].

      tls:
        type: object
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            default: false
            description: |
              Configures Varnish to listen for HTTPS traffic using native TLS. When enabled, `server.tls.config` should also be set. Certificates may be mounted into the Pod using `server.extraVolumeMounts` and `server.extraVolumes`.

          port:
            $ref: "#/definitions/port"
            default: 6443
            description: |
              Configures the TCP port on which Varnish will listen for HTTPS traffic. This port is used for Varnish to bind to within a container. To change the port exposed via service to other applications, see `server.service.https.port`.

              This port is used by the HTTPS service as a targetPort.

          hostPort:
            x-type-label: number
            anyOf:
              - $ref: "#/definitions/port"
              - type: "null"
            x-values-example: 8443
            description: |
              Sets the port to expose HTTPS traffic directly on the node the Pod runs on, as the container's [hostPort][k8s-pod-v1-containers].

          address:
            type: string
            default: "0.0.0.0"
            description: |
              Configures the address on which Varnish will listen for HTTPS traffic. Only applicable when `server.tls.config` is not set.

          config:
            type: string
            x-type-label: template string
            default: ""
            description: |
              The TLS configuration, passed to varnishd with `-A`. It is recommended to reference the port with the `{{ .Values.server.tls.port }}` template string to keep the configuration in sync with the service.
            x-examples:
              - description: "For example:"
                value: |
                  frontend = {
                    host = ""
                    port = "{{ .Values.server.tls.port }}"
                  }

                  pem-file = "/etc/varnish/certs/example.pem"

      extraListens:
        type: array
        default: []
        description: |
          An array of extra ports for Varnish to listen to.
        x-examples:
          - description: "For example:"
            value:
              - name: proxy
                address: "0.0.0.0"
                port: 6888
                proto: PROXY
              - name: proxy-sock
                path: /tmp/varnish-proxy.sock
                user: www
                group: www
                mode: "0700"
                proto: PROXY
        items:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              description: |
                The name of the listen. This name will be accessible in VCLs via `local.socket`.
            proto:
              type: string
              description: |
                The protocol of the listen. Must be one of `PROXY` or `HTTP`. Default to HTTP if not set.
            port:
              $ref: "#/definitions/port"
              description: |
                The port to listen to. Required unless `server.extraListens[].path` is set. Only applicable for TCP listens.
            address:
              type: string
              description: |
                The address to listen to. Only applicable for TCP listens.
            hostPort:
              x-type-label: number
              anyOf:
                - $ref: "#/definitions/port"
                - type: "null"
              description: |
                The port to expose this listen directly on the node the Pod runs on, as the container's [hostPort][k8s-pod-v1-containers]. Only applicable for TCP listens.
            path:
              type: string
              description: |
                The path of the UNIX domain socket to listen to. Required unless `server.extraListens[].port` is set. Only applicable for UNIX domain sockets. A listen with a path gets no container port.
            user:
              type: [string, integer]
              description: |
                The user owning the UNIX domain socket. Only applicable for UNIX domain sockets.
            group:
              type: [string, integer]
              description: |
                The group owning the UNIX domain socket. Only applicable for UNIX domain sockets.
            mode:
              type: string
              pattern: "^[0-7]{3,4}$"
              description: |
                The file mode octet for the UNIX domain socket, as a quoted string (e.g. "0700"). Only applicable for UNIX domain sockets.

      extraEnvs:
        $ref: "#/definitions/env"
        default: {}
        x-since:
          enterprise: v1.5.0
        description: |
          Sets additional environment variables for the {product} container. The value can be set as an object, an array of objects, or a template string.
        x-examples:
          - description: "For example, as an object:"
            value:
              MY_ENV_VAR: value
              MY_OTHER_ENV_VAR: other_value
          - description: "As an array of objects:"
            value:
              - name: MY_ENV_VAR
                value: value
              - name: MY_OTHER_ENV_VAR
                valueFrom:
                  configMapKeyRef:
                    name: my-config-map
                    key: my-key
          - description: "As a template string:"
            value: |
              - name: RELEASE_NAMESPACE
                value: {{ .Release.Namespace }}

      command:
        type: array
        items:
          type: string
        default: []
        description: |
          Sets the command for {product}. This replaces the whole command line built by the chart, including parameters, listening addresses, VCL and storage arguments. See also [varnishd documentation][varnishd].

      parameters:
        type: object
        additionalProperties:
          type: [string, number, boolean, array]
        default: {}
        description: |
          Sets {product} parameters (the `-p` argument of varnishd). Parameter names are converted from camelCase to snake_case, and arrays are joined with a comma. Parameters are passed in alphabetical order of their snake_case names, so `thread_pool_max` comes before `thread_pool_min`. Setting the same parameter twice with different spellings (e.g., `threadPoolMin` and `thread_pool_min`) fails rendering.
        x-examples:
          - description: "For example, the following results in `-p backend_idle_timeout=60 -p feature=+http2`:"
            value:
              backendIdleTimeout: "60"
              feature:
                - "+http2"

      extraInitContainers:
        $ref: "#/definitions/arrayOrTemplate"
        default: []
        description: |
          An array of objects that conform to the Kubernetes [initContainers][k8s-pod-v1-pods] definition of a Pod. This can be used to run initialization tasks before varnishd starts. Like any change to the Pod template, changing this value replaces the Pods. The value can be set as either an array of objects or a template string.
        x-examples:
          - description: "For example:"
            value: |
              - name: varnish-setup-tls
                securityContext:
                  {{- toYaml .Values.global.securityContext | nindent 4 }}
                image: debian:latest
                command:
                  - sh -c "sleep 3600"

      extraContainers:
        $ref: "#/definitions/arrayOrTemplate"
        default: []
        description: |
          An array of objects that conforms to the Kubernetes [containers][k8s-pod-v1-pods] definition of a Pod. This can be used to add a sidecar container to varnishd. The value can be set as either an array of objects or a template string. A sidecar that mounts the `{{ .Release.Name }}-varnish-vsm` volume at `/var/lib/varnish` can run `varnishstat`, `varnishlog` and `varnishadm` without `-n`, as varnishd uses its default working directory. The varnishd admin interface listens on `127.0.0.1:6082` and its secret is `/etc/varnish/shared/secret` (mount the `{{ .Release.Name }}-config-shared` volume at `/etc/varnish/shared`).
        x-examples:
          - description: "For example:"
            value: |
              - name: varnish-hello
                securityContext:
