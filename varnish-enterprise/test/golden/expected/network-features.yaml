apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: golden-varnish-enterprise
  labels:
    helm.sh/chart: varnish-enterprise-CHART_VERSION
    app.kubernetes.io/name: varnish-enterprise
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "APP_VERSION"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: varnish-enterprise
      app.kubernetes.io/instance: golden
  policyTypes:
    - Ingress
    - Egress
  ingress:
  - {}
  egress:
  - {}
---
# Source: varnish-enterprise/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: golden-varnish-enterprise
  labels:
    helm.sh/chart: varnish-enterprise-CHART_VERSION
    app.kubernetes.io/name: varnish-enterprise
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "APP_VERSION"
    app.kubernetes.io/managed-by: Helm
---
# Source: varnish-enterprise/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: golden-varnish-enterprise
  labels:
    helm.sh/chart: varnish-enterprise-CHART_VERSION
    app.kubernetes.io/name: varnish-enterprise
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "APP_VERSION"
