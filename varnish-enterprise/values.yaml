        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "varnish-common.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
          topologyKey: kubernetes.io/hostname

  # A list that conforms to the Kubernetes
  # [topologySpreadConstraints](https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/)
  # definition of a Pod. This configuration is used to spread Pods evenly across zones,
  # nodes or other topology domains. A constraint without a `labelSelector` (or with
  # `labelSelector: null`) selects the Pods of this release. The value can be set as
  # either an array or a template string. Not supported with `server.kind=DaemonSet`.
  #
  # `matchLabelKeys: [pod-template-hash]` (Kubernetes 1.27+) is recommended with
  # `server.kind=Deployment`. Without it, the Pods of the old and the new ReplicaSet are
  # counted together during a rolling update, and the new Pods can end up unevenly spread
  # once the old ones are gone.
  # Type: array or template string
  # Example:
  #   topologySpreadConstraints:
  #     - maxSkew: 1
  #       topologyKey: topology.kubernetes.io/zone
  #       whenUnsatisfiable: DoNotSchedule
  #       matchLabelKeys:
  #         - pod-template-hash
  topologySpreadConstraints: []

  # An object for configuring the
  # [NetworkPolicy](https://kubernetes.io/docs/concepts/services-networking/network-policies/)
  # of the Varnish Enterprise Pods.
  # Type: object
  # Availability: v1.9.0
  networkPolicy:
    # Enables the NetworkPolicy.
    # Type: boolean
    enabled: false

    # Allows all connections from any source. Set to false when using
    # `server.networkPolicy.extraIngress`.
    # Type: boolean
    allowIngress: true

    # Allows all connections to any destination. Set to false when using
