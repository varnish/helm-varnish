  # Type: number
  minThreads: 50

  # Sets the maximum number of worker threads in each pool. Passed as `-p thread_pool_max`
  # after `thread_pool_min` and before `server.parameters`. See also [varnishd
  # documentation](https://varnish-cache.org/docs/6.0/reference/varnishd.html).
  # Type: number
  maxThreads: 1000

  # Sets the command for Varnish Enterprise. Note that by overriding this, you will also
