apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden
  labels:
    app.kubernetes.io/instance: golden
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: golden
    app.kubernetes.io/version: APP_VERSION
    deploy-label: x
    helm.sh/chart: varnish-enterprise-CHART_VERSION
  annotations:
    deploy-annotation: true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: golden
      app.kubernetes.io/instance: golden
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: golden
        app.kubernetes.io/name: golden
        tier: edge
      annotations:
        checksum/golden-extra-extra-cm: 6d3fc6f0f003717c7e5188f3fcd9874f709ab7b0d8eaaa63f04e5e335fd4d868
        checksum/golden-vcl: efa6171b0848c327d81f850523aae1bc8d3a502564d77ccebc9e4c4cf930a49c
    spec:
      imagePullSecrets:
        - name: pull-secret
      serviceAccountName: golden
      securityContext:
        fsGroup: 999
      shareProcessNamespace: false
      containers:
        - name: varnish-enterprise
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "quay.io/varnish-software/varnish-plus:APP_VERSION"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6081
              protocol: TCP
            - name: extra-proxy
              containerPort: 8088
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 6081
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 6081
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              memory: 1Gi
          env:
            - name: "FOO"
              value: "bar"
          command:
            - /usr/sbin/varnishd
            - -F
            - -T
            - 127.0.0.1:6082
            - -f
            - /etc/varnish/default.vcl
            - -p
            - thread_pool_min=50
            - -p
            - thread_pool_max=1000
            - -p
            - thread_pool_stack=96k
            - -a
            - http=0.0.0.0:6081
            - -S
            - /etc/varnish/shared/secret
            - -a
            - proxy=:8088,PROXY
          volumeMounts:
            - name: golden-varnish-vsm
              mountPath: /var/lib/varnish
            - name: golden-config-shared
              mountPath: /etc/varnish/shared
            - name: golden-config-vcl
              mountPath: "/etc/varnish/default.vcl"
              subPath: default.vcl
        - name: varnish-enterprise-ncsa
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "quay.io/varnish-software/varnish-plus:APP_VERSION"
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/varnishncsa"]
          args:
            - -F
            - '%h %r %s'
          env:
            - name: VSM_NOPID
              value: "1"
          volumeMounts:
            - name: golden-varnish-vsm
              mountPath: /var/lib/varnish
            - name: golden-config-shared
              mountPath: /etc/varnish/shared
      initContainers:
        - name: varnish-enterprise-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: "quay.io/varnish-software/varnish-plus:APP_VERSION"
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: 1Gi
          command:
            - sh
            - -c
            - umask 077; test -s /etc/varnish/shared/secret || head -c 32 /dev/urandom > /etc/varnish/shared/secret
          volumeMounts:
            - name: golden-config-shared
              mountPath: /etc/varnish/shared
      volumes:
      - name: golden-varnish-vsm
        emptyDir:
          medium: "Memory"
      - name: golden-config-shared
        emptyDir:
          medium: "Memory"
      - name: golden-config-vcl
        configMap:
          name: golden-vcl
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: golden
                  app.kubernetes.io/instance: golden
              topologyKey: kubernetes.io/hostname
