    # Type: array or template string
    # Example:
    #   extraVolumeMounts: |
    #     - name: {{ .Release.Name }}-logs
    #       mountPath: /var/log/varnish
    extraVolumeMounts: []

  # An object for configuring the Varnish OTEL sidecar.
  # Type: object
  otel:
    # Runs `/usr/bin/varnish-otel` in a sidecar container to export Varnish logs and
    # metrics to an OTLP (OpenTelemetry Protocol) endpoint. The sidecar uses
    # `server.image`.
    # Type: boolean
    # Availability: v1.7.0
    enabled: false

    # An object that conforms to the Kubernetes
    # [securityContext](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
    # definition of a Container. This securityContext will be set on the OTEL container.
    # For setting securityContext on the Pod itself, see `global.podSecurityContext`. For
    # setting securityContext on every container the chart creates, see
    # `global.securityContext`.
    # Type: object or template string
    # Availability: v1.7.0
    securityContext: {}

    # An object that conforms to the Kubernetes
    # [resources](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
    # definition of a Container. This configuration can be used to limit resources
    # consumed by the OTEL container.
    # Type: object or template string
    # Availability: v1.7.0
    resources: {}

    # Sets environment variables of the OTEL container, typically to configure the
    # OpenTelemetry exporters. See also the [OpenTelemetry environment variables
    # specification](https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/).
    # Can be set as an object, an array of objects, or a template string.
    # Type: array of objects, object, or template string
    # Availability: v1.7.0
    # Example:
    #   env:
    #     OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    env: null

  # Configures Varnish Controller Agent sidecar for integration with Varnish Controller.
  # Type: object
  agent:
    # Enables the Varnish Controller Agent for integration with Varnish Controller.
    #
    # If Varnish Controller is deployed in a different namespace than Varnish Enterprise,
    # also set `global.natsServer.internal.namespace`.
    #
    # If Varnish Controller is deployed outside the Kubernetes cluster, or is using an
    # external NATS server not provided by Varnish Controller Helm Chart, set
    # `global.natsServer.internal.enabled` to `false` and configures
    # `global.natsServer.externalAddress`.
    # Type: boolean
    enabled: false

    # Sets the image and tag to use to deploy Varnish Controller Agent sidecar. The image
    # should be the same version as varnish-controller.
    # Type: object
    image:
      # Sets the repository for Varnish Controller Agent image. The Varnish Controller
      # image used here must be the same version as the Varnish Controller.
      repository: "quay.io/varnish-software/varnish-controller-agent"

      # Sets the
      # [imagePullPolicy](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
      # for the Varnish Controller image. This can be one of Always, Never, or
      # IfNotPresent.
      pullPolicy: "IfNotPresent"

      # Sets the tag for the Varnish Controller image. The Varnish Controller image used
      # here must be the same version as the Varnish Controller.
      tag: "7.5.1-6.0.16r13"

    # An object that conforms to the Kubernetes
    # [securityContext](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
    # definition of a Container.
    #
    # This securityContext will be set on the Varnish Controller container. For setting
    # securityContext on the Pod itself, see `global.podSecurityContext`. For setting
    # securityContext on every container the chart creates, see `global.securityContext`.
    # Type: object or template string
    securityContext: {}

    # Sets the extra environment variables for Varnish Controller Agent. Can be set as
    # either an object, an array of objects, or a template string.
    #
    # The agent is configured through environment variables, listed in the [Varnish
    # Controller Agent
    # documentation](https://docs.varnish-software.com/varnish-controller/installation/agents/).
    # Use this key for the ones the chart doesn't set, such as `VARNISH_CONTROLLER_LOG`
    # (log level), `VARNISH_CONTROLLER_TAGS` (comma-separated tags),
    # `VARNISH_CONTROLLER_LATITUDE`, `VARNISH_CONTROLLER_LONGITUDE` and
    # `VARNISH_CONTROLLER_PRIVATE_TOKEN`.
    # Type: array of objects, object, or template string
    # For example, as an object:
    # Example:
    #   extraEnvs:
    #     VARNISH_CONTROLLER_LOG: info
    #     VARNISH_CONTROLLER_TAGS: "tokyodc,highmem"
    # As an array of objects, reading the private token from a Secret:
    # Example:
    #   extraEnvs:
    #     - name: VARNISH_CONTROLLER_PRIVATE_TOKEN
    #       valueFrom:
    #         secretKeyRef:
    #           name: varnish-controller-agent
    #           key: private-token
    # As a template string:
    # Example:
    #   extraEnvs: |
    #     - name: RELEASE_NAMESPACE
    #       value: {{ .Release.Namespace }}
    extraEnvs: {}

    # Sets the extra configuration args for Varnish Controller Agent.
    # Type: array of strings
    extraArgs: []

    # An object that conforms to the Kubernetes
    # [resources](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
    # definition of a Container. This configuration can be used to limit resources
    # consumed by the Varnish Controller Agent container.
    # Type: object or template string
    # Example:
    #   resources:
    #     limits:
    #       cpu: "100m"
    #       memory: "128Mi"
    #     requests:
    #       cpu: "100m"
    #       memory: "128Mi"
    resources: {}

    # Declares the extra volumes to mount with Varnish Controller Agent container. Can be
    # set as either a YAML list or a template string.
    # Type: array or template string
    # Example:
    #   extraVolumeMounts: |
    #     - name: {{ .Release.Name }}-extra
    #       mountPath: /etc/varnish/extra
    extraVolumeMounts: []

    # Configures persistence for Varnish Controller Agent state, which is stored in
    # `/var/lib/varnish-controller`. Without it, the state is kept in an emptyDir volume
    # and lost when the Pod is deleted. See the [Integration with Varnish Controller
    # Agent](https://docs.varnish-software.com/varnish-helm/guides/setting-up-varnish-controller-agent/)
    # documentation for more information.
    # Type: object
    persistence:
      # Stores the Varnish Controller Agent state in a PersistentVolumeClaim created by
      # the StatefulSet. Only available when `server.kind` is `StatefulSet`; ignored when
      # `server.agent.enabled` is false.
      # Type: boolean
      enabled: false

      # Mounts the volume with this name on `/var/lib/varnish-controller` to store the
      # Varnish Controller Agent state. Works with every `server.kind`. The volume must be
      # declared with `server.extraVolumes` or, for a StatefulSet,
      # `server.extraVolumeClaimTemplates`. This configuration overrides
      # `server.agent.persistence.enabled`.
      # Type: string
      enableWithVolumeName: ""

      # Sets the extra labels for the PersistentVolumeClaim for Varnish Controller Agent.
      # Can be set as an object or a template string.
      # Type: object or template string
      labels: {}

      # Sets the extra annotations for the PersistentVolumeClaim for Varnish Controller
      # Agent. Can be set as an object or a template string.
      # Type: object or template string
      annotations: {}

      # Sets the storage access modes for the PersistentVolumeClaim for Varnish Controller
      # Agent.
      # Type: array of strings
      accessModes:
        - "ReadWriteOnce"

      # Sets the storage class for the PersistentVolumeClaim for Varnish Controller Agent.
      # Type: string
      storageClassName: ""

      # Sets the storage size for the PersistentVolumeClaim for Varnish Controller Agent.
      # Type: string
      storageSize: "512Mi"

    # Enables auto-removal of Varnish Enterprise instance with Varnish Controller upon pod
    # rollout (e.g. during a redeployment).
    # Type: object
    autoRemove:
      # Enable automatic de-registering of Varnish Controller Agent during Pod rollout.
      # The value can be one of `none` (disabled), or `vcli` (use VCLI to perform
      # de-registration).
      # Type: string, one of `none` or `vcli`
      # Availability: v1.6.0
      method: "none"

      # Configures "vcli" auto-removal method.
      # Type: object
      vcli:
        # Sets the image and tag to use to deploy Varnish Controller VCLI sidecar. The
        # image should be the same version as varnish-controller.
        # Type: object
        image:
          # Sets the repository for the Varnish Controller VCLI image.
          repository: "quay.io/varnish-software/varnish-controller-cli"

          # Sets the
          # [imagePullPolicy](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
          # for the Varnish Controller VCLI image.
          pullPolicy: "IfNotPresent"

          # Sets the tag for the Varnish Controller VCLI image.
          tag: "7.5.1"

        # An object that conforms to the Kubernetes
        # [securityContext](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
        # definition of a Container.
        #
        # This securityContext will be set on the Varnish Controller VCLI container. For
        # setting securityContext on the Pod itself, see `global.podSecurityContext`. For
        # setting securityContext on every container the chart creates, see
        # `global.securityContext`.
        # Type: object or template string
        securityContext: {}

        # Configures Varnish Controller Agent to use external Varnish Controller endpoint.
        # Ignored if `server.agent.autoRemove.vcli.internal.enabled` is set to `true`.
        # Type: string
        externalAddress: ""

        # Configures the username to connect to Varnish Controller API.
        # Type: string or number
        username: "admin"

        # Configures NATS password as a string.
        # Type: string or number
        password: ""

        # Configures NATS password from a Kubernetes secret. By default, it uses an
        # auto-generated password from a "varnish-controller-credentials" secret.
        # Type: object
        passwordFrom:
          # The name of the secret holding the password.
          # Type: string
          name: "varnish-controller-credentials"

          # The key of the secret holding the password.
          # Type: string
          key: "varnish-admin-password"

        # Configures Varnish Controller CLI container to skip verifying the certificate
        # when communicating via HTTPS. This should be set to true if Varnish Controller
        # is running with a self-signed certificates.
        # Type: boolean
        insecure: false

        # Configures internal settings for Varnish Controller CLI container.
        # Type: object
        internal:
          # Configures Varnish Controller CLI container to use the APIGW of the Varnish
          # Controller deployed in the cluster. It is found with
          # `global.natsServer.internal.releaseName`,
          # `global.natsServer.internal.namespace` and
          # `global.natsServer.internal.clusterDomain`, like the internal NATS server.
          # Type: boolean
          enabled: true

          # Configures the port of the Varnish Controller APIGW.
          # Type: number
          port: 8080

          # Configures Varnish Controller CLI container to use HTTPS instead of HTTP to
          # communicate with the in-cluster Varnish Controller instance.
          # Type: boolean
          https: false

        # An object that conforms to the Kubernetes
        # [resources](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
        # definition of a Container. This configuration can be used to limit resources
        # consumed by the Varnish Controller VCLI container.
        # Type: object or template string
        # Example:
        #   resources:
        #     limits:
        #       cpu: "100m"
        #       memory: "128Mi"
        #     requests:
        #       cpu: "100m"
        #       memory: "128Mi"
        resources: {}

        # Sets the extra environment variables for Varnish Controller VCLI. Can be set as
        # either an object, an array of objects, or a template string.
        # Type: array of objects, object, or template string
        # For example, as an object:
        # Example:
        #   extraEnvs:
        #     MY_ENV_VAR: value
        #     MY_OTHER_ENV_VAR: other_value
        # As an array of objects:
        # Example:
        #   extraEnvs:
        #     - name: MY_ENV_VAR
        #       value: value
        #     - name: MY_OTHER_ENV_VAR
        #       valueFrom:
        #         configMapKeyRef:
        #           name: my-config-map
        #           key: my-key
        # As a template string:
        # Example:
        #   extraEnvs: |
        #     - name: MY_ENV_VAR
        #       value: value
        extraEnvs: {}

        # Declares the extra volumes to mount with Varnish Controller VCLI. Can be set as
        # either a YAML list or a template string.
        # Type: array or template string
        # Example:
        #   extraVolumeMounts: |
        #     - name: {{ .Release.Name }}-local-mse
        #       mountPath: /var/lib/mse
        extraVolumeMounts: []

# An array of objects to attach Kubernetes manifests to the workload.
# Type: array of objects
# Availability: v1.2.1
# Example:
#   extraManifests:
#     - name: clusterrole
#       data: |
#         apiVersion: rbac.authorization.k8s.io/v1
#         kind: ClusterRole
#         metadata:
#           name: {{ .Release.Name }}-clusterrole
#         # ...
extraManifests: []

# An object for configuring clustering of the Varnish Enterprise Pods.
# Type: object
cluster:
  # Enables clustering and allows pods to shard requests between each others by:
  # - creating a headless service, even if `server.service.clusterIP != None`
  # - creating a secret token for pod to authorize peer-to-peer communication
  # - injecting a VCL preamble to your configuration
  # Type: boolean
  # Availability: 1.6.5
  enabled: false

  # Configures the headless service used by pods to discover each others. If empty, the
  # name defaults to `$VARNISH_SERVICE-peers` and the service is automatically created.
  # Type: string
  # Availability: 1.6.5
  headlessServiceName: ""

  # Configures the
  # [token](https://docs.varnish-software.com/varnish-enterprise/features/cluster/#token)
  # used by nodes to authorize peer-to-peer communication. If empty, a
  # `$VARNISH_SERVICE-cluster-secret` secret is automatically created.
  # Type: string
  # Availability: 1.6.5
  secretName: ""

  # Activates
  # [traces](https://docs.varnish-software.com/varnish-enterprise/features/cluster#traces).
  # Type: boolean
  # Availability: 1.6.5
  trace: false

  # Sets the number of
  # [primaries](https://docs.varnish-software.com/varnish-enterprise/features/cluster/#primaries)
  # for each object. Must be a strictly positive integer. If unset, the Varnish Enterprise
  # default is used.
  # Type: number
  # Availability: v1.9.0
  primaries: null

  # Sets the
  # [fallback](https://docs.varnish-software.com/varnish-enterprise/features/cluster/#fallback)
  # level. Must be a positive integer (zero included). If unset, the Varnish Enterprise
  # default is used.
  # Type: number
  # Availability: v1.9.0
  fallback: null
