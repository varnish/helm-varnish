{{- $secretConfig := include "varnish.secretConfig" . }}
{{- if ne $secretConfig "" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "varnish.fullname" . }}-secret
  labels:
    {{- include "varnish.labels" . | nindent 4 }}
data:
  secret: {{ $secretConfig | trim | b64enc }}
{{- end }}
{{- if and .Values.cluster.enabled (not .Values.cluster.secretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "varnish.fullname" . }}-cluster-secret
  labels:
    {{- include "varnish.labels" . | nindent 4 }}
data:
  token: "{{ randAlphaNum 20 | b64enc }}"
{{- end }}
