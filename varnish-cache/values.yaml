  # Type: string
  vclConfigPath: "/etc/varnish/default.vcl"

  # A VCL configuration for Varnish Cache.
  # Type: template string
  # Example:
  #   vclConfig: |
  #     vcl 4.1;
  #
  #     backend default {
  #       .host = "www.example.com";
  #       .port = "80";
  #     }
  #
  #     sub vcl_backend_fetch {
  #       set bereq.http.Host = "www.example.com";
  #     }
  vclConfig: ""

  # Use the content of the given file path as VCL configuration. The file will be parsed
  # as templated string. Will override `server.vclConfig` if set. Note that the file must
  # be placed inside the files/ directory in the Helm chart itself.
  # Type: string
  # Example:
  #   vclConfigFile: files/default.vcl
  vclConfigFile: ""

  # Extra VCL configuration where a filename as a key and template string as a value. The
  # path to store `server.vclConfigs` will be relative to that of `server.vclConfigPath`.
  #
  # If the filename in `server.vclConfigs` matches the name in `server.vclConfigPath`, it
  # will be treated in the same way as `server.vclConfig`. In this case,
  # `server.vclConfig` must not be set.
  # Type: object of template strings
  # For example, with `server.vclConfigPath` set to `/etc/varnish/default.vcl`, the
  # following configuration saves the file as `/etc/varnish/extra.vcl`:
  # Example:
  #   vclConfigs:
  #     extra.vcl: |
  #       vcl 4.1;
  #
  #       backend default {
  #         .host = "127.0.0.1";
  #         .port = "8090";
  #       }
  # With `server.vclConfigPath` set to `/etc/varnish/default.vcl`, the following is
  # effectively the same as setting `server.vclConfig`, which must then be unset:
  # Example:
  #   vclConfigs:
  #     default.vcl: |
  #       vcl 4.1;
  #
  #       backend default {
  #         .host = "127.0.0.1";
  #         .port = "8090";
  #       }
  vclConfigs: {}

  # Per-domain VCL routing (multi-tenant). When `server.vcls.routes` is set, the chart
  # generates a routing VCL and a cmdfile from these settings, superseding the
  # `server.vclConfig*` fields. `server.cmdfileConfig` and `server.cmdfileConfigFile` must
  # not be set when `server.vcls.routes` is non-empty.
  # Type: object
  vcls:
    # Per-domain VCL routing. When set, the chart generates a routing VCL and a cmdfile
    # that load each route as a separate VCL and select it based on the Host header,
    # superseding `server.vclConfig`, `server.vclConfigFile`, `server.vclConfigs` and
    # `server.cmdfileConfig` (which must not be set). Each route must set `vclContent`,
    # and can set `name` (defaults to the first hostname, prefixed with `route_` if it
    # does not start with a letter) and `hostnames`. As it is used as a VCL label, `name`
    # must start with a letter. A route without hostnames is a catch-all and must be the
    # last one.
    # Type: array of objects
    # Example:
    #   routes:
    #     - name: foo-site
    #       hostnames:
    #         - foo.com
    #         - www.foo.com
    #       vclContent: |
    #         vcl 4.1;
    #         backend default { .host = "foo-backend"; }
    #     - vclContent: |
    #         vcl 4.1;
    #         backend default none;
    #         sub vcl_recv { return (synth(404)); }
    routes: []

    # Shared VCL files placed in `/etc/varnish/vcls/`, next to the route VCLs. Each key is
    # a filename and each value a template string. Requires `server.vcls.routes`. Route
    # VCLs include them with a relative path (`include "./helpers.vcl";`), as plain
    # filenames are looked up in `vcl_path` instead.
    # Type: object of template strings
    # Example:
    #   includes:
    #     helpers.vcl: |
    #       sub common_recv {
    #       }
    includes: {}

  # A path to the [CLI command
  # file](https://varnish-cache.org/docs/trunk/reference/varnishd.html#cli-command-file).
  # This configuration affects the location where `server.cmdfileConfig` will be saved to,
  # as well as the `-I` argument in the Varnish Cache container when
  # `server.cmdfileConfig` is not empty.
  # Type: string
  cmdfileConfigPath: "/etc/varnish/cmds.cli"

  # A [CLI command
  # file](https://varnish-cache.org/docs/trunk/reference/varnishd.html#cli-command-file)
