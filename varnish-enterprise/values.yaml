    # [NetworkPolicyEgressRule](https://kubernetes.io/docs/reference/kubernetes-api/policy-resources/network-policy-v1/#NetworkPolicySpec)
    # definition. Only used when `server.networkPolicy.allowEgress` is false.
    # Type: array of objects
    # Example:
    #   extraEgress:
    #     - to:
    #         - podSelector:
    #             matchLabels:
    #               component: apache
    #       ports:
    #         - port: 80
    #           protocol: TCP
    extraEgress: []

  # An object for configuring
  # [varnishncsa](https://varnish-cache.org/docs/6.0/reference/varnishncsa.html).
  # Type: object
  varnishncsa:
    # Enables HTTP request logging via
    # [varnishncsa](https://varnish-cache.org/docs/6.0/reference/varnishncsa.html).
    # Type: boolean
    enabled: true

    # Sets the extra arguments to varnishncsa. Without `-b` or `-c`, varnishncsa logs
    # client requests.
    # Type: string or array of strings
    extraArgs: []

    # Sets additional environment variables for the varnishncsa container. Can be set as
    # an object, an array of objects, or a template string.
    # Type: array of objects, object, or template string
    # For example, as an object:
    # Example:
    #   extraEnvs:
    #     MY_ENV_VAR: value
    #     MY_OTHER_ENV_VAR: other_value
    # As an array of objects:
    # Example:
    #   extraEnvs:
    #     - name: MY_ENV_VAR
    #       value: value
    #     - name: MY_OTHER_ENV_VAR
    #       valueFrom:
    #         configMapKeyRef:
    #           name: my-config-map
    #           key: my-key
    # As a template string:
    # Example:
    #   extraEnvs: |
    #     - name: RELEASE_NAMESPACE
    #       value: {{ .Release.Namespace }}
    extraEnvs: {}

    # An object that conforms to the Kubernetes
    # [resources](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers)
    # definition of a Container. This configuration can be used to limit resources
    # consumed by the varnishncsa container.
    # Type: object or template string
    # Example:
    #   resources:
    #     limits:
    #       cpu: "100m"
    #       memory: "128Mi"
    #     requests:
    #       cpu: "100m"
    #       memory: "128Mi"
    resources: {}

    # An array of objects that conforms to the Kubernetes
